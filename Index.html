<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Simple Flappy Bird</title>
    <style>
        body { margin: 0; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; background: #70c5ce; }
        canvas { border: 2px solid #000; background-color: #fff; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="320" height="480"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // ตั้งค่าตัวแปรเกม
        let birdX = 50;
        let birdY = 150;
        let birdSize = 20;
        let gravity = 0.6;
        let velocity = 0;
        let jump = -8;
        let score = 0;
        let gameActive = true;

        // ท่อ
        let pipes = [];
        let pipeWidth = 50;
        let pipeGap = 120;
        let pipeSpeed = 2;

        // รับค่าการกด Spacebar
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                if (gameActive) {
                    velocity = jump;
                } else {
                    resetGame();
                }
            }
        });

        function createPipe() {
            let pipeHeight = Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + 50;
            pipes.push({ x: canvas.width, y: pipeHeight });
        }

        function resetGame() {
            birdY = 150;
            velocity = 0;
            pipes = [];
            score = 0;
            gameActive = true;
            loop();
        }

        function update() {
            if (!gameActive) return;

            velocity += gravity;
            birdY += velocity;

            // ตกพื้นหรือเลยเพดาน
            if (birdY + birdSize > canvas.height || birdY < 0) {
                gameActive = false;
            }

            // จัดการท่อ
            if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 200) {
                createPipe();
            }

            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= pipeSpeed;

                // ตรวจสอบการชน
                if (
                    birdX + birdSize > pipes[i].x &&
                    birdX < pipes[i].x + pipeWidth &&
                    (birdY < pipes[i].y || birdY + birdSize > pipes[i].y + pipeGap)
                ) {
                    gameActive = false;
                }

                // นับคะแนน
                if (pipes[i].x + pipeWidth < birdX && !pipes[i].passed) {
                    score++;
                    pipes[i].passed = true;
                }

                // ลบท่อที่เลยหน้าจอ
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }
        }

        function draw() {
            // ล้างจอ
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // วาดนก
            ctx.fillStyle = "yellow";
            ctx.fillRect(birdX, birdY, birdSize, birdSize);

            // วาดท่อ
            ctx.fillStyle = "green";
            pipes.forEach(p => {
                ctx.fillRect(p.x, 0, pipeWidth, p.y); // ท่อบน
                ctx.fillRect(p.x, p.y + pipeGap, pipeWidth, canvas.height); // ท่อล่าง
            });

            // วาดคะแนน
            ctx.fillStyle = "black";
            ctx.font = "24px Arial";
            ctx.fillText(`Score: ${score}`, 10, 30);

            if (!gameActive) {
                ctx.fillText("GAME OVER", 80, canvas.height / 2);
                ctx.font = "16px Arial";
                ctx.fillText("Press Space to Restart", 85, canvas.height / 2 + 40);
            }
        }

        function loop() {
            update();
            draw();
            if (gameActive) {
                requestAnimationFrame(loop);
            }
        }

        loop();
    </script>
</body>
</html>
