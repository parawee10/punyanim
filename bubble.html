<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Student Project</title>
    <style>
        body {
            margin: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            background-color: #333;
            display: block;
            border: 2px solid #555;
            max-width: 100vw;
            max-height: 80vh;
        }
        .ui {
            color: white;
            padding: 10px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="ui">
    <div id="score">คะแนน: 0 | ยิงไปแล้ว: 0/7</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
/** * ตั้งค่าเริ่มต้นของเกม
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');

// ขนาดจอเกม
canvas.width = 400;
canvas.height = 600;

const ROWS = 12;      // จำนวนแถวสูงสุด
const COLS = 8;       // จำนวนคอลัมน์
const RADIUS = 25;    // รัศมีลูกบอล
const OFFSET_X = 25;  // ระยะห่างจากขอบซ้าย
const OFFSET_Y = 25;  // ระยะห่างจากขอบบน
const COLORS = ['#FF5252', '#4CAF50', '#2196F3', '#FFEB3B', '#E040FB', '#FF9800'];
const DEADLINE_Y = canvas.height - 80; // เส้นจำกัดด้านล่าง

let grid = [];
let score = 0;
let shotsFired = 0;
let currentBubble = null;
let isShooting = false;
let gameOver = false;

// พิกัดปืน (กึ่งกลางล่าง)
const shooterPos = { x: canvas.width / 2, y: canvas.height - 40 };

/**
 * สร้างตารางลูกบอลเริ่มต้น
 */
function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (let c = 0; c < COLS; c++) {
            if (r < 4) { // เริ่มต้นมี 4 แถว
                grid[r][c] = COLORS[Math.floor(Math.random() * COLORS.length)];
            } else {
                grid[r][c] = null;
            }
        }
    }
}

/**
 * สร้างลูกบอลที่จะยิง
 */
function createNewBubble() {
    currentBubble = {
        x: shooterPos.x,
        y: shooterPos.y,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: 0,
        vy: 0
    };
}

/**
 * วาดลูกบอล
 */
function drawBubble(x, y, color) {
    if (!color) return;
    ctx.beginPath();
    ctx.arc(x, y, RADIUS - 2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    // เพิ่มมิติแสงเงาเล็กน้อย
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.closePath();
}

/**
 * หาระยะห่างระหว่างจุด 2 จุด
 */
function getDistance(x1, y1, x2, y2) {
    return Math.sqrt((x2 - x1)**2 + (y2 - y1)**2);
}

/**
 * เมื่อมีการยิงและบอลกระทบ/ติดผนัง
 */
function snapToGrid(bubble) {
    let bestR = 0, bestC = 0;
    let minDist = 9999;

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let posX = c * (RADIUS * 2) + OFFSET_X + (r % 2 === 1 ? RADIUS : 0);
            let posY = r * (RADIUS * 2) + OFFSET_Y;
            let d = getDistance(bubble.x, bubble.y, posX, posY);
            if (d < minDist) {
                minDist = d;
                bestR = r;
                bestC = c;
            }
        }
    }

    grid[bestR][bestC] = bubble.color;
    checkMatch(bestR, bestC);
    
    shotsFired++;
    if (shotsFired >= 7) {
        addNewRow();
        shotsFired = 0;
    }
    
    checkGameOver();
    if (!gameOver) createNewBubble();
    isShooting = false;
}

/**
 * ตรวจสอบลูกบอลสีเดียวกันที่ติดกัน (ใช้ระบบ Flood Fill)
 */
function checkMatch(row, col) {
    let color = grid[row][col];
    let matches = [{r: row, c: col}];
    let queue = [{r: row, c: col}];
    let visited = new Set();
    visited.add(row + "," + col);

    while (queue.length > 0) {
        let curr = queue.shift();
        let neighbors = getNeighbors(curr.r, curr.c);
        
        for (let n of neighbors) {
            if (n.r >= 0 && n.r < ROWS && n.c >= 0 && n.c < COLS) {
                if (grid[n.r][n.c] === color && !visited.has(n.r + "," + n.c)) {
                    visited.add(n.r + "," + n.c);
                    matches.push(n);
                    queue.push(n);
                }
            }
        }
    }

    if (matches.length >= 3) {
        matches.forEach(m => grid[m.r][m.c] = null);
        score += matches.length * 10;
    }
}

/**
 * หาตำแหน่งลูกบอลข้างเคียง (รองรับแถวแบบสลับฟันปลา)
 */
function getNeighbors(r, c) {
    let neighbors = [];
    let odd = r % 2 === 1;
    neighbors.push({r: r, c: c-1}, {r: r, c: c+1}, {r: r-1, c: c}, {r: r+1, c: c});
    neighbors.push({r: r-1, c: odd ? c+1 : c-1}, {r: r+1, c: odd ? c+1 : c-1});
    return neighbors;
}

/**
 * เพิ่มแถวใหม่จากด้านบน
 */
function addNewRow() {
    // เลื่อนแถวลงมา
    for (let r = ROWS - 1; r > 0; r--) {
        grid[r] = [...grid[r-1]];
    }
    // เพิ่มแถวใหม่ที่แถว 0
    grid[0] = [];
    for (let c = 0; c < COLS; c++) {
        grid[0][c] = COLORS[Math.floor(Math.random() * COLORS.length)];
    }
}

function checkGameOver() {
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c]) {
                let posY = r * (RADIUS * 2) + OFFSET_Y;
                if (posY >= DEADLINE_Y - RADIUS) {
                    gameOver = true;
                }
            }
        }
    }
}

/**
 * การวาดหน้าจอหลัก
 */
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // วาดเส้นตาย (Deadline)
    ctx.strokeStyle = "red";
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, DEADLINE_Y);
    ctx.lineTo(canvas.width, DEADLINE_Y);
    ctx.stroke();
    ctx.setLineDash([]);

    // วาดตารางบอล
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            let posX = c * (RADIUS * 2) + OFFSET_X + (r % 2 === 1 ? RADIUS : 0);
            let posY = r * (RADIUS * 2) + OFFSET_Y;
            drawBubble(posX, posY, grid[r][c]);
        }
    }

    // อัปเดตการเคลื่อนที่ของลูกบอลที่ยิง
    if (isShooting && currentBubble) {
        currentBubble.x += currentBubble.vx;
        currentBubble.y += currentBubble.vy;

        // ชนขอบซ้าย-ขวา
        if (currentBubble.x - RADIUS <= 0 || currentBubble.x + RADIUS >= canvas.width) {
            currentBubble.vx *= -1;
        }

        // ชนเพดาน
        if (currentBubble.y - RADIUS <= 0) {
            snapToGrid(currentBubble);
        }

        // ตรวจสอบการชนกับบอลในกริต
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c]) {
                    let posX = c * (RADIUS * 2) + OFFSET_X + (r % 2 === 1 ? RADIUS : 0);
                    let posY = r * (RADIUS * 2) + OFFSET_Y;
                    if (getDistance(currentBubble.x, currentBubble.y, posX, posY) < RADIUS * 1.5) {
                        snapToGrid(currentBubble);
                        break;
                    }
                }
            }
            if (!isShooting) break;
        }
        drawBubble(currentBubble.x, currentBubble.y, currentBubble.color);
    } else if (!gameOver) {
        drawBubble(shooterPos.x, shooterPos.y, currentBubble.color);
    }

    // แสดงข้อความ Game Over
    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);
        ctx.font = "20px Arial";
        ctx.fillText("คลิกเพื่อเริ่มใหม่", canvas.width/2, canvas.height/2 + 40);
    }

    scoreElement.innerText = `คะแนน: ${score} | ยิงไปแล้ว: ${shotsFired}/7`;
    requestAnimationFrame(update);
}

/**
 * การควบคุมการยิง (รองรับทั้ง Click และ Touch)
 */
function handleInput(e) {
    if (gameOver) {
        initGrid();
        score = 0;
        shotsFired = 0;
        gameOver = false;
        createNewBubble();
        return;
    }

    if (isShooting) return;

    let rect = canvas.getBoundingClientRect();
    let clientX = e.clientX || (e.touches ? e.touches[0].clientX : 0);
    let clientY = e.clientY || (e.touches ? e.touches[0].clientY : 0);
    
    let mouseX = clientX - rect.left;
    let mouseY = clientY - rect.top;

    // คำนวณทิศทาง
    let angle = Math.atan2(mouseY - shooterPos.y, mouseX - shooterPos.x);
    let speed = 8;
    currentBubble.vx = Math.cos(angle) * speed;
    currentBubble.vy = Math.sin(angle) * speed;

    // ยิงขึ้นข้างบนเท่านั้น
    if (currentBubble.vy < 0) {
        isShooting = true;
    }
}

window.addEventListener('mousedown', handleInput);
window.addEventListener('touchstart', (e) => {
    handleInput(e);
    e.preventDefault();
}, {passive: false});

// เริ่มเกม
initGrid();
createNewBubble();
update();

</script>
</body>
</html>
