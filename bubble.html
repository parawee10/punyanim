<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Fixed</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        .ui { width: 440px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.2rem; }
        canvas { background: #000; border: 4px solid #333; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); max-width: 95vw; max-height: 80vh; }
    </style>
</head>
<body>
    <div class="ui">
        <span>Score: <span id="score">0</span></span>
        <span>Next Push: <span id="next-push">7</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 440;
        canvas.height = 660;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const bubbleRadius = 22;
        const rows = 15;
        const cols = 10;
        let score = 0;
        let shotCount = 0;
        const pushLimit = 7;

        let grid = [];

        function initGrid() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                grid.push(createEmptyRow(r < 5));
            }
        }

        function createEmptyRow(isActive) {
            let row = [];
            for (let c = 0; c < cols; c++) {
                row.push({
                    active: isActive,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)]
                });
            }
            return row;
        }

        let shooter = { x: canvas.width / 2, y: canvas.height - 50, color: COLORS[0], active: false, dx: 0, dy: 0, speed: 20 };

        function getBubblePos(r, c) {
            let xOffset = (r % 2 === 0) ? 0 : bubbleRadius;
            return {
                x: c * (bubbleRadius * 2) + bubbleRadius + xOffset,
                y: r * (bubbleRadius * 1.7) + bubbleRadius + 15
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // วาดลูกบอลใน Grid
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        drawBubble(pos.x, pos.y, grid[r][c].color);
                    }
                }
            }

            // เส้นเล็ง
            if (isPointerDown && !shooter.active) {
                ctx.beginPath();
                ctx.setLineDash([5, 10]);
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 150, shooter.y + Math.sin(shooter.angle) * 150);
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.stroke();
                ctx.setLineDash([]);
            }

            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;
                if (shooter.x < bubbleRadius || shooter.x > canvas.width - bubbleRadius) shooter.dx *= -1;
                handleCollision();
            }
            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            // แสงเงาลูกแก้ว
            let grad = ctx.createRadialGradient(x - 6, y - 6, 2, x, y, bubbleRadius);
            grad.addColorStop(0, 'rgba(255,255,255,0.4)');
            grad.addColorStop(1, 'rgba(0,0,0,0.2)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
        }

        function handleCollision() {
            let hit = (shooter.y < bubbleRadius);
            let collisionRow, collisionCol;

            if (!hit) {
                for (let r = 0; r < grid.length; r++) {
                    for (let c = 0; c < grid[r].length; c++) {
                        if (grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            if (Math.hypot(shooter.x - pos.x, shooter.y - pos.y) < bubbleRadius * 1.5) {
                                hit = true; break;
                            }
                        }
                    }
                }
            }

            if (hit) {
                let bestFit = { r: 0, c: 0, dist: 9999 };
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            let d = Math.hypot(shooter.x - pos.x, shooter.y - pos.y);
                            if (d < bestFit.dist) bestFit = { r, c, dist: d };
                        }
                    }
                }

                grid[bestFit.r][bestFit.c].active = true;
                grid[bestFit.r][bestFit.c].color = shooter.color;
                
                checkMatch(bestFit.r, bestFit.c);
                
                shotCount++;
                document.getElementById('next-push').innerText = pushLimit - shotCount;

                if (shotCount >= pushLimit) {
                    pushNewRow();
                    shotCount = 0;
                    document.getElementById('next-push').innerText = pushLimit;
                }

                if (bestFit.r >= rows - 1) { alert("Game Over!"); initGrid(); score = 0; }
                resetShooter();
            }
        }

        function pushNewRow() {
            // 1. แทรกแถวใหม่ที่ Index 0 (บนสุด)
            grid.unshift(createEmptyRow(true));
            // 2. ตัดแถวสุดท้ายทิ้ง เพื่อให้จำนวนแถวเท่าเดิม
            grid.pop();
            
            // เช็คว่าแถวสุดท้ายมีลูกบอลติดอยู่ไหม
            for (let c = 0; c < cols; c++) {
                if (grid[rows-1][c].active) {
                    alert("Game Over!");
                    initGrid();
                    break;
                }
            }
        }

        function checkMatch(startR, startC) {
            let color = grid[startR][startC].color;
            let matches = [];
            let queue = [{r: startR, c: startC}];
            let visited = new Set();
            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.r},${curr.c}`;
                if (visited.has(key)) continue;
                visited.add(key);
                if (grid[curr.r] && grid[curr.r][curr.c] && grid[curr.r][curr.c].active && grid[curr.r][curr.c].color === color) {
                    matches.push(curr);
                    let rowOffset = curr.r % 2 === 0 ? -1 : 0;
                    let neighbors = [{r:curr.r, c:curr.c-1}, {r:curr.r, c:curr.c+1}, {r:curr.r-1, c:curr.c+rowOffset}, {r:curr.r-1, c:curr.c+rowOffset+1}, {r:curr.r+1, c:curr.c+rowOffset}, {r:curr.r+1, c:curr.c+rowOffset+1}];
                    neighbors.forEach(n => { if (grid[n.r] && grid[n.r][n.c]) queue.push(n); });
                }
            }
            if (matches.length >= 3) {
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 10;
                document.getElementById('score').innerText = score;
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 50;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        let isPointerDown = false;
        const updateInput = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        };
        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateInput(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateInput(e); });
        canvas.addEventListener('pointerup', () => { 
            if (isPointerDown && !shooter.active) { 
                shooter.dx = Math.cos(shooter.angle) * shooter.speed; 
                shooter.dy = Math.sin(shooter.angle) * shooter.speed; 
                shooter.active = true; 
            } 
            isPointerDown = false; 
        });

        initGrid();
        resetShooter();
        draw();
    </script>
</body>
</html>
