<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Pro</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { background: #000; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 95vw; max-height: 80vh; }
        .ui { margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="ui">
        <h2 id="score">Score: 0</h2>
        <p>ลากเพื่อเล็ง และปล่อยเพื่อยิง!</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 400;
        canvas.height = 600;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const bubbleRadius = 20;
        const rows = 8;
        const cols = 9;
        let score = 0;

        // 1. สร้างตารางลูกบอล
        let grid = [];
        for (let r = 0; r < rows; r++) {
            grid[r] = [];
            for (let c = 0; c < cols; c++) {
                grid[r][c] = {
                    r: r, c: c,
                    x: c * (bubbleRadius * 2) + bubbleRadius + (r % 2 === 0 ? 0 : bubbleRadius),
                    y: r * (bubbleRadius * 1.7) + bubbleRadius + 20,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    active: r < 4 // เริ่มต้นให้มีแค่ 4 แถวแรก
                };
            }
        }

        let shooter = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            active: false,
            dx: 0, dy: 0, speed: 15,
            angle: 0
        };

        let isPointerDown = false;

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดเส้นเล็ง
            if (isPointerDown && !shooter.active) {
                ctx.beginPath();
                ctx.setLineDash([5, 10]);
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 150, shooter.y + Math.sin(shooter.angle) * 150);
                ctx.strokeStyle = "rgba(255,255,255,0.5)";
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // วาดลูกบอลในตาราง
            grid.forEach(row => row.forEach(b => {
                if (b.active) drawBubble(b.x, b.y, b.color);
            }));

            // วาดตัวยิง
            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;

                if (shooter.x < bubbleRadius || shooter.x > canvas.width - bubbleRadius) shooter.dx *= -1;

                checkCollision();
                if (shooter.y < 0) resetShooter();
            }

            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function checkCollision() {
            grid.forEach(row => row.forEach(b => {
                if (b.active) {
                    let dist = Math.hypot(shooter.x - b.x, shooter.y - b.y);
                    if (dist < bubbleRadius * 1.5) {
                        // เมื่อชน ให้หาตัวที่สีเหมือนกันรอบๆ
                        popBubbles(b.r, b.c, shooter.color);
                        resetShooter();
                    }
                }
            }));
        }

        function popBubbles(r, c, targetColor) {
            let matches = [];
            let queue = [{r, c}];
            let visited = new Set();

            if (grid[r][c].color !== targetColor) return;

            while (queue.length > 0) {
                let current = queue.shift();
                let key = `${current.r},${current.c}`;
                if (visited.has(key)) continue;
                visited.add(key);

                if (grid[current.r] && grid[current.r][current.c] && grid[current.r][current.c].active && grid[current.r][current.c].color === targetColor) {
                    matches.push(current);
                    // เช็คเพื่อนบ้าน 6 ทิศ (Hexagonal)
                    let neighbors = [
                        {r: current.r, c: current.c-1}, {r: current.r, c: current.c+1},
                        {r: current.r-1, c: current.c}, {r: current.r+1, c: current.c},
                        {r: current.r-1, c: current.c + (current.r % 2 === 0 ? -1 : 1)},
                        {r: current.r+1, c: current.c + (current.r % 2 === 0 ? -1 : 1)}
                    ];
                    queue.push(...neighbors.filter(n => grid[n.r] && grid[n.r][n.c]));
                }
            }

            if (matches.length >= 2) { // 2 ตัวเดิม + ตัวที่ยิงไป = 3
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 10;
                document.getElementById('score').innerText = `Score: ${score}`;
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 50;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        function updateAngle(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        }

        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateAngle(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateAngle(e); });
        canvas.addEventListener('pointerup', (e) => {
            if (isPointerDown && !shooter.active) {
                shooter.dx = Math.cos(shooter.angle) * shooter.speed;
                shooter.dy = Math.sin(shooter.angle) * shooter.speed;
                shooter.active = true;
            }
            isPointerDown = false;
        });

        draw();
    </script>
</body>
</html>
