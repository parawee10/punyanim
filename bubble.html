<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Smooth Endless</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; height: 100vh; 
            color: white; font-family: sans-serif; overflow: hidden; touch-action: none; 
        }
        .ui { width: 440px; display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.2rem; font-weight: bold; }
        canvas { 
            background: #000; border: 4px solid #333; border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5); max-width: 95vw; max-height: 80vh; 
        }
        #score { color: #50BFE6; }
        #next-push { color: #FF355E; }
    </style>
</head>
<body>

    <div class="ui">
        <span>Score: <span id="score">0</span></span>
        <span>Next: <span id="next-push">7</span></span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 440;
        canvas.height = 660;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const bubbleRadius = 22;
        const rows = 15; 
        const cols = 10;
        
        let score = 0;
        let shotCount = 0;
        const pushLimit = 7; // ปรับเป็น 7 รอบตามโจทย์

        // ระบบ Animation การเลื่อนลง
        let visualOffset = 0; // ระยะที่เลื่อนลงมา (0 ถึง 1.7 * bubbleRadius)
        let isAnimatingPush = false;

        let grid = [];
        function initGrid() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                grid[r] = [];
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = { r, c, color: COLORS[Math.floor(Math.random() * COLORS.length)], active: r < 5 };
                }
            }
        }

        let shooter = { x: canvas.width / 2, y: canvas.height - 50, color: COLORS[0], active: false, dx: 0, dy: 0, speed: 22 };

        function getBubblePos(r, c) {
            let xOffset = (r % 2 === 0) ? 0 : bubbleRadius;
            let yBase = r * (bubbleRadius * 1.7) + bubbleRadius + 15;
            // เพิ่ม visualOffset เข้าไปเพื่อให้มันดูค่อยๆ ไหลลงมา
            return {
                x: c * (bubbleRadius * 2) + bubbleRadius + xOffset,
                y: yBase + visualOffset 
            };
        }

        function draw() {
            ctx.fillStyle = '#0b0b0b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // ถ้ากำลังเล่น Animation ให้ค่อยๆ เพิ่ม visualOffset
            if (isAnimatingPush) {
                visualOffset += 2; // ความเร็วในการไหลลง
                if (visualOffset >= bubbleRadius * 1.7) {
                    finalizePush(); // เมื่อไหลจนครบระยะ ให้เปลี่ยนข้อมูล Grid จริงๆ
                }
            }

            // วาดลูกบอล
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        drawBubble(pos.x, pos.y, grid[r][c].color);
                    }
                }
            }

            // เส้นเล็ง
            if (isPointerDown && !shooter.active) {
                ctx.beginPath();
                ctx.setLineDash([5, 8]);
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 150, shooter.y + Math.sin(shooter.angle) * 150);
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.stroke();
                ctx.setLineDash([]);
            }

            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;
                if (shooter.x < bubbleRadius || shooter.x > canvas.width - bubbleRadius) shooter.dx *= -1;
                handleCollision();
            }
            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.stroke();
        }

        function handleCollision() {
            let hit = (shooter.y < bubbleRadius + visualOffset);
            if (!hit) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            if (Math.hypot(shooter.x - pos.x, shooter.y - pos.y) < bubbleRadius * 1.5) { hit = true; break; }
                        }
                    }
                }
            }

            if (hit) {
                let bestFit = { r: 0, c: 0, dist: 9999 };
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            let d = Math.hypot(shooter.x - pos.x, shooter.y - pos.y);
                            if (d < bestFit.dist) bestFit = { r, c, dist: d };
                        }
                    }
                }

                grid[bestFit.r][bestFit.c].active = true;
                grid[bestFit.r][bestFit.c].color = shooter.color;
                checkMatch(bestFit.r, bestFit.c);
                
                shotCount++;
                document.getElementById('next-push').innerText = pushLimit - shotCount;

                if (shotCount >= pushLimit) {
                    isAnimatingPush = true; // เริ่มการเลื่อนลงแบบ Smooth
                    shotCount = 0;
                }

                if (bestFit.r >= rows - 2) { alert("Game Over!"); initGrid(); score = 0; }
                resetShooter();
            }
        }

        function finalizePush() {
            isAnimatingPush = false;
            visualOffset = 0; // รีเซ็ตค่าการขยับภาพ
            
            // ขยับข้อมูลจริงใน Array (เลื่อนลง 1 แถว)
            for (let r = rows - 1; r > 0; r--) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c].active = grid[r - 1][c].active;
                    grid[r][c].color = grid[r - 1][c].color;
                }
            }
            // เติมแถวใหม่ด้านบน
            for (let c = 0; c < cols; c++) {
                grid[0][c].active = true;
                grid[0][c].color = COLORS[Math.floor(Math.random() * COLORS.length)];
            }
            document.getElementById('next-push').innerText = pushLimit;
        }

        function checkMatch(startR, startC) {
            let targetColor = grid[startR][startC].color;
            let matches = [];
            let queue = [{r: startR, c: startC}];
            let visited = new Set();
            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.r},${curr.c}`;
                if (visited.has(key)) continue;
                visited.add(key);
                if (grid[curr.r] && grid[curr.r][curr.c] && grid[curr.r][curr.c].active && grid[curr.r][curr.c].color === targetColor) {
                    matches.push(curr);
                    let rowOffset = curr.r % 2 === 0 ? -1 : 0;
                    let neighbors = [{r:curr.r, c:curr.c-1}, {r:curr.r, c:curr.c+1}, {r:curr.r-1, c:curr.c+rowOffset}, {r:curr.r-1, c:curr.c+rowOffset+1}, {r:curr.r+1, c:curr.c+rowOffset}, {r:curr.r+1, c:curr.c+rowOffset+1}];
                    neighbors.forEach(n => { if (grid[n.r] && grid[n.r][n.c]) queue.push(n); });
                }
            }
            if (matches.length >= 3) {
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 10;
                document.getElementById('score').innerText = score;
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 50;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        let isPointerDown = false;
        function updateInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        }
        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateInput(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateInput(e); });
        canvas.addEventListener('pointerup', () => { 
            if (isPointerDown && !shooter.active && !isAnimatingPush) { 
                shooter.dx = Math.cos(shooter.angle) * shooter.speed; 
                shooter.dy = Math.sin(shooter.angle) * shooter.speed; 
                shooter.active = true; 
            } 
            isPointerDown = false; 
        });

        initGrid();
        resetShooter();
        draw();
    </script>
</body>
</html>
