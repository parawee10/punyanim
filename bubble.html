<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Classic Bubble Shooter Smooth</title>
    <style>
        body { 
            margin: 0; background: #121212; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; height: 100vh; 
            color: white; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; touch-action: none; 
        }
        .ui { width: 440px; display: flex; justify-content: space-between; margin-bottom: 12px; font-weight: bold; font-size: 1.3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        canvas { 
            background: radial-gradient(circle, #1a1a1a 0%, #000 100%); 
            border: 6px solid #333; border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8); max-width: 95vw; max-height: 80vh; 
        }
        #score { color: #00f2fe; }
        #next-push { color: #ff54b0; }
    </style>
</head>
<body>

    <div class="ui">
        <span>Score: <span id="score">0</span></span>
        <span>Push In: <span id="next-push">7</span></span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 440;
        canvas.height = 660;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const bubbleRadius = 22;
        const rows = 15; 
        const cols = 10;
        
        let score = 0;
        let shotCount = 0;
        const pushLimit = 7; 
        let visualOffset = 0; 
        let isAnimatingPush = false;

        let grid = [];
        function initGrid() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                grid[r] = [];
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = { 
                        active: r < 5, 
                        color: COLORS[Math.floor(Math.random() * COLORS.length)] 
                    };
                }
            }
        }

        let shooter = { x: canvas.width / 2, y: canvas.height - 50, color: COLORS[0], active: false, dx: 0, dy: 0, speed: 20, angle: 0 };

        function getBubblePos(r, c) {
            let xOffset = (r % 2 === 0) ? 0 : bubbleRadius;
            let yBase = r * (bubbleRadius * 1.7) + bubbleRadius + 15;
            return { x: c * (bubbleRadius * 2) + bubbleRadius + xOffset, y: yBase + visualOffset };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (isAnimatingPush) {
                visualOffset += 3; // สปีดการเลื่อนลง
                if (visualOffset >= bubbleRadius * 1.7) {
                    finalizePush();
                }
            }

            // วาดลูกบอลในตาราง
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        drawBubble(pos.x, pos.y, grid[r][c].color);
                    }
                }
            }

            // เส้นเล็ง
            if (isPointerDown && !shooter.active) {
                ctx.beginPath();
                ctx.setLineDash([5, 10]);
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 150, shooter.y + Math.sin(shooter.angle) * 150);
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.stroke();
                ctx.setLineDash([]);
            }

            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;
                if (shooter.x < bubbleRadius || shooter.x > canvas.width - bubbleRadius) shooter.dx *= -1;
                handleCollision();
            }
            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.save();
            // ใส่เงาพื้นหลังลูกบอล
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 4;

            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            // ใส่ไฮไลท์แสงตกกระทบ (ทำให้ดูเป็น 3D)
            let gradient = ctx.createRadialGradient(x - 6, y - 6, 2, x, y, bubbleRadius);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
            ctx.fillStyle = gradient;
            ctx.fill();

            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.restore();
        }

        function handleCollision() {
            let hit = (shooter.y < bubbleRadius + visualOffset);
            if (!hit) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            if (Math.hypot(shooter.x - pos.x, shooter.y - pos.y) < bubbleRadius * 1.5) { hit = true; break; }
                        }
                    }
                }
            }

            if (hit) {
                let bestFit = { r: 0, c: 0, dist: 9999 };
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            let d = Math.hypot(shooter.x - pos.x, shooter.y - pos.y);
                            if (d < bestFit.dist) bestFit = { r, c, dist: d };
                        }
                    }
                }

                grid[bestFit.r][bestFit.c].active = true;
                grid[bestFit.r][bestFit.c].color = shooter.color;
                checkMatch(bestFit.r, bestFit.c);
                
                shotCount++;
                document.getElementById('next-push').innerText = pushLimit - shotCount;

                if (shotCount >= pushLimit) {
                    isAnimatingPush = true;
                    shotCount = 0;
                }

                if (bestFit.r >= rows - 1) { 
                    alert("Game Over! Score: " + score); 
                    initGrid(); 
                    score = 0; 
                    document.getElementById('score').innerText = 0;
                }
                resetShooter();
            }
        }

        function finalizePush() {
            isAnimatingPush = false;
            visualOffset = 0;
            
            // ขยับเฉพาะข้อมูล Active และ Color ลงมาแถวถัดไป (คงค่าเดิมไว้เป๊ะๆ)
            for (let r = rows - 1; r > 0; r--) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c].active = grid[r - 1][c].active;
                    grid[r][c].color = grid[r - 1][c].color;
                }
            }
            // เพิ่มแถวใหม่แค่แถวบนสุด (Row 0)
            for (let c = 0; c < cols; c++) {
                grid[0][c].active = true;
                grid[0][c].color = COLORS[Math.floor(Math.random() * COLORS.length)];
            }
            document.getElementById('next-push').innerText = pushLimit;
        }

        function checkMatch(startR, startC) {
            let color = grid[startR][startC].color;
            let matches = [];
            let queue = [{r: startR, c: startC}];
            let visited = new Set();
            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.r},${curr.c}`;
                if (visited.has(key)) continue;
                visited.add(key);
                if (grid[curr.r] && grid[curr.r][curr.c] && grid[curr.r][curr.c].active && grid[curr.r][curr.c].color === color) {
                    matches.push(curr);
                    let rowOffset = curr.r % 2 === 0 ? -1 : 0;
                    let neighbors = [{r:curr.r, c:curr.c-1}, {r:curr.r, c:curr.c+1}, {r:curr.r-1, c:curr.c+rowOffset}, {r:curr.r-1, c:curr.c+rowOffset+1}, {r:curr.r+1, c:curr.c+rowOffset}, {r:curr.r+1, c:curr.c+rowOffset+1}];
                    neighbors.forEach(n => { if (grid[n.r] && grid[n.r][n.c]) queue.push(n); });
                }
            }
            if (matches.length >= 3) {
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 10;
                document.getElementById('score').innerText = score;
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 50;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        let isPointerDown = false;
        function updateInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        }
        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateInput(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateInput(e); });
        canvas.addEventListener('pointerup', () => { 
            if (isPointerDown && !shooter.active && !isAnimatingPush) { 
                shooter.dx = Math.cos(shooter.angle) * shooter.speed; 
                shooter.dy = Math.sin(shooter.angle) * shooter.speed; 
                shooter.active = true; 
            } 
            isPointerDown = false; 
        });

        initGrid();
        resetShooter();
        draw();
    </script>
</body>
</html>
