<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter DIY</title>
    <style>
        body { 
            margin: 0; 
            background: #1a1a1a; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            color: white;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        canvas { 
            background: #000; 
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            max-width: 95vw; 
            max-height: 80vh; 
            cursor: crosshair;
        }
        .ui { margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="ui">
        <h2>Bubble Shooter</h2>
        <p>แตะหรือคลิกเพื่อยิง!</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ตั้งค่าขนาด
        canvas.width = 400;
        canvas.height = 600;

        const COLORS = ['#FF355E', '#50BFE6', '#FF6037', '#66FF66', '#FFFF66'];
        const bubbleRadius = 20;
        const rows = 6;
        const cols = 9;

        // 1. สร้างตารางลูกบอลด้านบน
        let grid = [];
        for (let r = 0; r < rows; r++) {
            grid[r] = [];
            for (let c = 0; c < cols; c++) {
                // เยื้องแถวเลขคี่เพื่อให้ดูเหมือนรังผึ้ง
                let xOffset = (r % 2 === 0) ? 0 : bubbleRadius;
                grid[r][c] = {
                    x: c * (bubbleRadius * 2) + bubbleRadius + xOffset,
                    y: r * (bubbleRadius * 1.7) + bubbleRadius + 10,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    active: true
                };
            }
        }

        // 2. ข้อมูลตัวยิง
        let shooter = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            active: false,
            dx: 0,
            dy: 0,
            speed: 12
        };

        function draw() {
            // ล้างหน้าจอ
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดตารางลูกบอล
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let b = grid[r][c];
                    if (b.active) {
                        drawBubble(b.x, b.y, b.color);
                    }
                }
            }

            // วาดลูกบอลที่จะยิง
            drawBubble(shooter.x, shooter.y, shooter.color);

            // อัปเดตตำแหน่งลูกบอลที่ยิง
            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;

                // เด้งกำแพงซ้าย-ขวา
                if (shooter.x - bubbleRadius < 0 || shooter.x + bubbleRadius > canvas.width) {
                    shooter.dx *= -1;
                }

                // เช็คการชนกับลูกบอลด้านบน
                checkCollision();

                // ถ้าหลุดขอบบน
                if (shooter.y < 0) {
                    resetShooter();
                }
            }

            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            // เพิ่มเงาให้ดูมีมิติ
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.closePath();
        }

        function checkCollision() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    let b = grid[r][c];
                    if (b.active) {
                        let dist = Math.hypot(shooter.x - b.x, shooter.y - b.y);
                        if (dist < bubbleRadius * 2) {
                            // เมื่อชน ให้ลูกบอลหายไป (เบื้องต้น)
                            b.active = false; 
                            resetShooter();
                            return;
                        }
                    }
                }
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 50;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        // รองรับทั้งคลิกและทัช
        function handleInput(e) {
            if (shooter.active) return;

            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const targetX = clientX - rect.left;
            const targetY = clientY - rect.top;

            const angle = Math.atan2(targetY - shooter.y, targetX - shooter.x);
            
            shooter.dx = Math.cos(angle) * shooter.speed;
            shooter.dy = Math.sin(angle) * shooter.speed;
            shooter.active = true;
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e);
        }, {passive: false});

        // เริ่มเกม
        draw();
    </script>
</body>
</html>
