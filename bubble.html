<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Mobile</title>
    <style>
        body { 
            margin: 0; background: #111; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; height: 100vh; 
            color: white; font-family: sans-serif; overflow: hidden; touch-action: none; 
        }
        .ui { width: 360px; display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1rem; }
        canvas { 
            background: #000; border: 2px solid #444; 
            max-width: 95vw; max-height: 75vh; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div class="ui">
        <span>คะแนน: <span id="score">0</span></span>
        <span>ยิงอีก: <span id="next-push">7</span></span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ปรับขนาดให้เหมาะกับมือถือ (Ratio 9:16)
        canvas.width = 360;
        canvas.height = 540;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const bubbleRadius = 18;
        const cols = 10;
        const deadLineY = canvas.height - 80; // เส้นตาย
        
        let score = 0;
        let shotCount = 0;
        const pushLimit = 7;
        let grid = [];

        function createNewRow(isOffset) {
            let row = [];
            for (let c = 0; c < cols; c++) {
                row.push({
                    active: true,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    isOffset: isOffset // เก็บค่าไว้ว่าแถวนี้ต้องเยื้องหรือไม่
                });
            }
            return row;
        }

        function initGrid() {
            grid = [];
            score = 0;
            shotCount = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('next-push').innerText = pushLimit;
            // เริ่มต้น 4 แถว
            for (let r = 0; r < 4; r++) {
                grid.push(createNewRow(r % 2 !== 0));
            }
        }

        let shooter = {
            x: canvas.width / 2,
            y: canvas.height - 35,
            color: COLORS[0],
            active: false,
            dx: 0, dy: 0, speed: 15, angle: 0
        };

        function getBubblePos(r, c) {
            // ใช้ค่า isOffset ที่เก็บไว้ในแถวนั้นๆ เพื่อไม่ให้มันสลับไปมาตอนเลื่อนลง
            let xOffset = (grid[r] && grid[r][c] && grid[r][c].isOffset) ? bubbleRadius : 0;
            return {
                x: c * (bubbleRadius * 2) + bubbleRadius + xOffset,
                y: r * (bubbleRadius * 1.7) + bubbleRadius + 10
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // วาดเส้นตาย (Deadline)
            ctx.beginPath();
            ctx.moveTo(0, deadLineY);
            ctx.lineTo(canvas.width, deadLineY);
            ctx.strokeStyle = "red";
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            // วาดลูกบอลในตาราง
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        drawBubble(pos.x, pos.y, grid[r][c].color);
                        
                        // เช็ค Game Over: ถ้าลูกบอลที่ active แตะเส้นตาย
                        if (pos.y + bubbleRadius >= deadLineY) {
                            alert("จบเกม! ลูกบอลถึงเส้นตาย");
                            initGrid();
                            return;
                        }
                    }
                }
            }

            // เส้นเล็ง
            if (isPointerDown && !shooter.active) {
                ctx.beginPath();
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 100, shooter.y + Math.sin(shooter.angle) * 100);
                ctx.strokeStyle = "rgba(255,255,255,0.3)";
                ctx.stroke();
            }

            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;
                if (shooter.x < bubbleRadius || shooter.x > canvas.width - bubbleRadius) shooter.dx *= -1;
                checkCollision();
                if (shooter.y < 0) resetShooter();
            }
            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.shadowBlur = 5;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.fill();
            // เงาไฮไลท์
            let grad = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, bubbleRadius);
            grad.addColorStop(0, 'rgba(255,255,255,0.3)');
            grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
        }

        function checkCollision() {
            let hit = false;
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        if (Math.hypot(shooter.x - pos.x, shooter.y - pos.y) < bubbleRadius * 1.5) {
                            hit = true; break;
                        }
                    }
                }
            }

            if (hit || shooter.y < bubbleRadius) {
                stickBubble();
            }
        }

        function stickBubble() {
            // หาช่องที่ใกล้ที่สุด
            let best = { r: 0, c: 0, dist: 9999 };
            // เพิ่มแถวว่างรอไว้ถ้าจำเป็น
            if (grid.length < 20) {
                grid.push(new Array(cols).fill(null).map((_, i) => ({active: false, color: '', isOffset: grid[grid.length-1].isOffset === false})));
            }

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        let d = Math.hypot(shooter.x - pos.x, shooter.y - pos.y);
                        if (d < best.dist) best = { r, c, dist: d };
                    }
                }
            }

            grid[best.r][best.c].active = true;
            grid[best.r][best.c].color = shooter.color;
            
            checkMatch(best.r, best.c);
            
            shotCount++;
            if (shotCount >= pushLimit) {
                // เพิ่มแถวใหม่ 1 แถวข้างบน
                let newIsOffset = !grid[0].isOffset;
                grid.unshift(createNewRow(newIsOffset));
                shotCount = 0;
            }
            document.getElementById('next-push').innerText = pushLimit - shotCount;
            resetShooter();
        }

        function checkMatch(startR, startC) {
            let color = grid[startR][startC].color;
            let matches = [];
            let queue = [{r: startR, c: startC}];
            let visited = new Set();
            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.r},${curr.c}`;
                if (visited.has(key)) continue;
                visited.add(key);
                if (grid[curr.r] && grid[curr.r][curr.c] && grid[curr.r][curr.c].active && grid[curr.r][curr.c].color === color) {
                    matches.push(curr);
                    let rowOffset = grid[curr.r][curr.c].isOffset;
                    let off = rowOffset ? 0 : -1;
                    let neighbors = [
                        {r:curr.r, c:curr.c-1}, {r:curr.r, c:curr.c+1},
                        {r:curr.r-1, c:curr.c+off}, {r:curr.r-1, c:curr.c+off+1},
                        {r:curr.r+1, c:curr.c+off}, {r:curr.r+1, c:curr.c+off+1}
                    ];
                    neighbors.forEach(n => { if (grid[n.r] && grid[n.r][n.c]) queue.push(n); });
                }
            }
            if (matches.length >= 3) {
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 10;
                document.getElementById('score').innerText = score;
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 35;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        let isPointerDown = false;
        function updateInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        }
        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateInput(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateInput(e); });
        canvas.addEventListener('pointerup', () => { 
            if (isPointerDown && !shooter.active) {
                shooter.dx = Math.cos(shooter.angle) * shooter.speed;
                shooter.dy = Math.sin(shooter.angle) * shooter.speed;
                shooter.active = true;
            }
            isPointerDown = false;
        });

        initGrid();
        draw();
    </script>
</body>
</html>
