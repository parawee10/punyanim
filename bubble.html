<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Master</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { background: #000; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 95vw; max-height: 85vh; }
        .ui { margin-bottom: 5px; text-align: center; }
    </style>
</head>
<body>
    <div class="ui">
        <h2 id="score">Score: 0</h2>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 440;
        canvas.height = 660;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const bubbleRadius = 22;
        const rows = 12;
        const cols = 10;
        let score = 0;

        let grid = [];
        for (let r = 0; r < rows; r++) {
            grid[r] = [];
            for (let c = 0; c < cols; c++) {
                grid[r][c] = {
                    r: r, c: c,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    active: r < 5 // เริ่มต้น 5 แถว
                };
            }
        }

        let shooter = {
            x: canvas.width / 2, y: canvas.height - 50,
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            active: false, dx: 0, dy: 0, speed: 18, angle: 0
        };

        let isPointerDown = false;

        function getBubblePos(r, c) {
            let xOffset = (r % 2 === 0) ? 0 : bubbleRadius;
            return {
                x: c * (bubbleRadius * 2) + bubbleRadius + xOffset,
                y: r * (bubbleRadius * 1.7) + bubbleRadius + 10
            };
        }

        function draw() {
            ctx.fillStyle = '#0b0b0b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดเส้นเล็ง
            if (isPointerDown && !shooter.active) {
                ctx.beginPath();
                ctx.setLineDash([5, 8]);
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 200, shooter.y + Math.sin(shooter.angle) * 200);
                ctx.strokeStyle = "rgba(255,255,255,0.4)";
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // วาดลูกบอลในตาราง
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        drawBubble(pos.x, pos.y, grid[r][c].color);
                    }
                }
            }

            // วาดลูกบอลที่กำลังยิง
            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;

                if (shooter.x < bubbleRadius || shooter.x > canvas.width - bubbleRadius) shooter.dx *= -1;

                handleCollision();
            }
            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.shadowBlur = 5;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function handleCollision() {
            // ชนขอบบน หรือชนลูกบอลอื่น
            let hit = false;
            if (shooter.y < bubbleRadius) hit = true;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        if (Math.hypot(shooter.x - pos.x, shooter.y - pos.y) < bubbleRadius * 1.5) {
                            hit = true;
                        }
                    }
                }
            }

            if (hit) {
                // หาช่องที่ว่างและใกล้ที่สุดเพื่อ "แปะ" ลูกบอลลงไป
                let bestFit = { r: 0, c: 0, dist: 9999 };
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            let d = Math.hypot(shooter.x - pos.x, shooter.y - pos.y);
                            if (d < bestFit.dist) {
                                bestFit = { r, c, dist: d };
                            }
                        }
                    }
                }

                let target = grid[bestFit.r][bestFit.c];
                target.active = true;
                target.color = shooter.color;
                
                checkMatch(bestFit.r, bestFit.c);
                resetShooter();
            }
        }

        function checkMatch(startR, startC) {
            let color = grid[startR][startC].color;
            let matches = [];
            let queue = [{r: startR, c: startC}];
            let visited = new Set();

            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.r},${curr.c}`;
                if (visited.has(key)) continue;
                visited.add(key);

                if (grid[curr.r] && grid[curr.r][curr.c] && grid[curr.r][curr.c].active && grid[curr.r][curr.c].color === color) {
                    matches.push(curr);
                    // เพื่อนบ้าน 6 ทิศ
                    let rowOffset = curr.r % 2 === 0 ? -1 : 0;
                    let neighbors = [
                        {r: curr.r, c: curr.c-1}, {r: curr.r, c: curr.c+1},
                        {r: curr.r-1, c: curr.c + rowOffset}, {r: curr.r-1, c: curr.c + rowOffset + 1},
                        {r: curr.r+1, c: curr.c + rowOffset}, {r: curr.r+1, c: curr.c + rowOffset + 1}
                    ];
                    neighbors.forEach(n => {
                        if (grid[n.r] && grid[n.r][n.c]) queue.push(n);
                    });
                }
            }

            if (matches.length >= 3) {
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 20;
                document.getElementById('score').innerText = `Score: ${score}`;
                // โบนัส: เช็คลูกบอลที่ลอยเคว้ง (ไม่มีตัวยึด)
                dropFloatingBubbles();
            }
        }

        function dropFloatingBubbles() {
            // ระบบตรวจสอบลูกบอลที่ไม่ได้เชื่อมต่อกับเพดาน (ถ้ามีเวลาค่อยเติมจะทำให้เกมสมบูรณ์มาก)
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 50;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        function updateInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        }

        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateInput(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateInput(e); });
        canvas.addEventListener('pointerup', (e) => {
            if (isPointerDown && !shooter.active) {
                shooter.dx = Math.cos(shooter.angle) * shooter.speed;
                shooter.dy = Math.sin(shooter.angle) * shooter.speed;
                shooter.active = true;
            }
            isPointerDown = false;
        });

        draw();
    </script>
</body>
</html>
