<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Bubble Shooter + Aim Line</title>
<style>
    body {
        margin: 0;
        background: linear-gradient(#1e1e2f, #2b2b45);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
    }
    canvas {
        background: #111;
        border-radius: 12px;
        touch-action: none;
    }
</style>
</head>
<body>

<canvas id="game" width="360" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const R = 14;
const COLS = Math.floor(W / (R * 2));
const COLORS = ["red", "yellow", "lime", "cyan", "magenta"];
const BOTTOM_LINE = H - 120;

let grid = [];
let currentBall;
let shots = 0;
let score = 0;
let gameOver = false;

let aiming = false;
let aimX = 0;
let aimY = 0;

// ===== เริ่มเกม =====
function init() {
    grid = [];
    shots = 0;
    score = 0;
    gameOver = false;
    addRow();
    addRow();
    spawnBall();
}

// ===== เพิ่มแถว =====
function addRow() {
    const row = [];
    for (let i = 0; i < COLS; i++) {
        row.push({
            x: R + i * R * 2,
            y: R,
            color: COLORS[Math.floor(Math.random() * COLORS.length)]
        });
    }
    grid.unshift(row);
}

// ===== เลื่อนลง =====
function shiftDown() {
    let moved = 0;
    const id = setInterval(() => {
        grid.flat().forEach(b => b.y += 2);
        moved += 2;
        if (moved >= R * 2) {
            clearInterval(id);
            checkGameOver();
        }
    }, 16);
}

// ===== ลูกปืน =====
function spawnBall() {
    currentBall = {
        x: W / 2,
        y: H - 60,
        vx: 0,
        vy: 0,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        moving: false
    };
}

// ===== ยิง =====
function shoot(tx, ty) {
    if (currentBall.moving || gameOver) return;

    const dx = tx - currentBall.x;
    const dy = ty - currentBall.y;
    const len = Math.hypot(dx, dy);

    currentBall.vx = dx / len * 6;
    currentBall.vy = dy / len * 6;
    currentBall.moving = true;
}

// ===== ตรวจชน =====
function checkCollision() {
    for (let b of grid.flat()) {
        const d = Math.hypot(currentBall.x - b.x, currentBall.y - b.y);
        if (d < R * 2) {
            snapBall();
            return;
        }
    }
    if (currentBall.y <= R) snapBall();
}

// ===== ติดลูก =====
function snapBall() {
    currentBall.moving = false;

    const row = Math.round((currentBall.y - R) / (R * 2));
    const col = Math.round((currentBall.x - R) / (R * 2));

    if (!grid[row]) grid[row] = [];
    grid[row].push({
        x: R + col * R * 2,
        y: R + row * R * 2,
        color: currentBall.color
    });

    checkMatch(row);
    shots++;

    if (shots % 7 === 0) {
        addRow();
        shiftDown();
    }

    spawnBall();
}

// ===== ตรวจ 3 ลูก =====
function checkMatch(row) {
    const r = grid[row];
    if (!r) return;

    const count = {};
    r.forEach(b => count[b.color] = (count[b.color] || 0) + 1);

    for (let c in count) {
        if (count[c] >= 3) {
            grid[row] = r.filter(b => b.color !== c);
            score += count[c] * 10;
        }
    }
}

// ===== Game Over =====
function checkGameOver() {
    for (let b of grid.flat()) {
        if (b.y + R >= BOTTOM_LINE) {
            gameOver = true;
            setTimeout(init, 2000);
            break;
        }
    }
}

// ===== วาดลูก =====
function drawBall(b) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.fill();
}

// ===== เส้นเล็ง =====
function drawAimLine() {
    if (!aiming || currentBall.moving) return;

    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = "#aaa";
    ctx.beginPath();
    ctx.moveTo(currentBall.x, currentBall.y);

    let dx = aimX - currentBall.x;
    let dy = aimY - currentBall.y;
    let len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;

    let x = currentBall.x;
    let y = currentBall.y;

    for (let i = 0; i < 60; i++) {
        x += dx * 8;
        y += dy * 8;

        if (x < R || x > W - R) dx *= -1;

        ctx.lineTo(x, y);
        if (y < 0) break;
    }

    ctx.stroke();
    ctx.setLineDash([]);
}

// ===== วาด =====
function draw() {
    ctx.clearRect(0, 0, W, H);

    // เส้นล่าง
    ctx.strokeStyle = "red";
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, BOTTOM_LINE);
    ctx.lineTo(W, BOTTOM_LINE);
    ctx.stroke();
    ctx.setLineDash([]);

    grid.flat().forEach(drawBall);
    drawBall(currentBall);
    drawAimLine();

    ctx.fillStyle = "#fff";
    ctx.fillText("Score: " + score, 10, H - 20);

    if (gameOver) {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#fff";
        ctx.font = "28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", W / 2, H / 2);
        ctx.textAlign = "left";
    }
}

// ===== Update =====
function update() {
    if (currentBall.moving) {
        currentBall.x += currentBall.vx;
        currentBall.y += currentBall.vy;

        if (currentBall.x < R || currentBall.x > W - R) {
            currentBall.vx *= -1;
        }
        checkCollision();
    }
}

// ===== Loop =====
function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// ===== Input =====
function getPos(e) {
    const r = canvas.getBoundingClientRect();
    return {
        x: (e.clientX || e.touches[0].clientX) - r.left,
        y: (e.clientY || e.touches[0].clientY) - r.top
    };
}

canvas.addEventListener("mousedown", e => {
    aiming = true;
    const p = getPos(e);
    aimX = p.x; aimY = p.y;
});
canvas.addEventListener("mousemove", e => {
    if (!aiming) return;
    const p = getPos(e);
    aimX = p.x; aimY = p.y;
});
canvas.addEventListener("mouseup", e => {
    aiming = false;
    shoot(aimX, aimY);
});

canvas.addEventListener("touchstart", e => {
    aiming = true;
    const p = getPos(e);
    aimX = p.x; aimY = p.y;
});
canvas.addEventListener("touchmove", e => {
    const p = getPos(e);
    aimX = p.x; aimY = p.y;
});
canvas.addEventListener("touchend", () => {
    aiming = false;
    shoot(aimX, aimY);
});

init();
loop();
</script>
</body>
</html>
