<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Mobile Edition</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; height: 100vh; 
            color: white; font-family: 'Arial', sans-serif; overflow: hidden; touch-action: none; 
        }
        .ui { width: 360px; display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        canvas { 
            background: #000; border: 3px solid #444; border-radius: 8px;
            max-width: 95vw; max-height: 70vh; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #score { color: #00f2fe; }
        #next-push { color: #ff54b0; }
    </style>
</head>
<body>

    <div class="ui">
        <span>คะแนน: <span id="score">0</span></span>
        <span>ยิงอีก: <span id="next-push">7</span></span>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ขนาดหน้าจอที่เหมาะสมกับมือถือ
        canvas.width = 360;
        canvas.height = 540;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const radius = 18; // รัศมีลูกบอล
        const cols = 10;
        const pushLimit = 7; // ยิงกี่ครั้งถึงจะเพิ่มแถว
        const deadLineY = canvas.height - 80; // เส้นตาย

        let grid = [];
        let score = 0;
        let shotCount = 0;
        let isPushing = false;
        let visualOffset = 0; // สำหรับทำ Animation ไหลลง

        // สร้างแถวใหม่
        function createNewRow(isOffset) {
            let row = [];
            for (let c = 0; c < cols; c++) {
                row.push({
                    active: true,
                    color: COLORS[Math.floor(Math.random() * COLORS.length)],
                    isOffset: isOffset
                });
            }
            return row;
        }

        // เริ่มต้นเกม
        function initGrid() {
            grid = [];
            score = 0;
            shotCount = 0;
            visualOffset = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('next-push').innerText = pushLimit;
            for (let r = 0; r < 5; r++) {
                grid.push(createNewRow(r % 2 !== 0));
            }
        }

        let shooter = {
            x: canvas.width / 2,
            y: canvas.height - 35,
            color: COLORS[0],
            active: false,
            dx: 0, dy: 0, speed: 15, angle: 0
        };

        // คำนวณตำแหน่งลูกบอลใน Grid
        function getBubblePos(r, c) {
            const padding = 2;
            let xOffset = (grid[r] && grid[r][c] && grid[r][c].isOffset) ? radius : 0;
            return {
                x: padding + c * (radius * 2) + radius + xOffset,
                y: r * (radius * 1.7) + radius + 10 + visualOffset
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ระบบค่อยๆ เลื่อนลงมา (Smooth Animation)
            if (isPushing) {
                visualOffset += 1.5;
                if (visualOffset >= radius * 1.7) {
                    completePush();
                }
            }

            // วาดเส้นตาย
            ctx.beginPath();
            ctx.moveTo(0, deadLineY);
            ctx.lineTo(canvas.width, deadLineY);
            ctx.strokeStyle = "red";
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            // วาดลูกบอลในตาราง
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        drawBubble(pos.x, pos.y, grid[r][c].color);
                        
                        // ตรวจสอบ Game Over
                        if (pos.y + radius >= deadLineY) {
                            alert("GAME OVER! คะแนนของคุณคือ " + score);
                            initGrid();
                            resetShooter();
                            return;
                        }
                    }
                }
            }

            // เส้นเล็ง
            if (isPointerDown && !shooter.active && !isPushing) {
                ctx.beginPath();
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 60, shooter.y + Math.sin(shooter.angle) * 60);
                ctx.strokeStyle = "white";
                ctx.stroke();
            }

            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;
                if (shooter.x < radius || shooter.x > canvas.width - radius) shooter.dx *= -1;
                checkCollision();
                if (shooter.y < 0) resetShooter();
            }
            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, radius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            // ใส่แสงเงาให้ดูมีมิติ
            let grad = ctx.createRadialGradient(x - 5, y - 5, 2, x, y, radius);
            grad.addColorStop(0, 'rgba(255,255,255,0.4)');
            grad.addColorStop(1, 'rgba(0,0,0,0.1)');
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.closePath();
        }

        function checkCollision() {
            let hit = false;
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        if (Math.hypot(shooter.x - pos.x, shooter.y - pos.y) < radius * 1.5) {
                            hit = true; break;
                        }
                    }
                }
            }
            if (hit || shooter.y < radius) stickBubble();
        }

        function stickBubble() {
            let best = { r: 0, c: 0, dist: 9999 };
            // เพิ่มแถวใหม่ในหน่วยความจำหากลูกบอลยิงสูงเกินไป
            if (grid.length < 25) {
                grid.push(new Array(cols).fill(null).map(() => ({active: false, color: '', isOffset: false})));
                for(let r=0; r<grid.length; r++) grid[r].forEach(b => b.isOffset = (r % 2 !== 0));
            }

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        let d = Math.hypot(shooter.x - pos.x, shooter.y - pos.y);
                        if (d < best.dist) best = { r, c, dist: d };
                    }
                }
            }

            grid[best.r][best.c].active = true;
            grid[best.r][best.c].color = shooter.color;
            
            checkMatch(best.r, best.c);
            
            shotCount++;
            if (shotCount >= pushLimit) {
                isPushing = true; // เริ่มการไหลลง
                shotCount = 0;
            }
            document.getElementById('next-push').innerText = pushLimit - shotCount;
            resetShooter();
        }

        function completePush() {
            isPushing = false;
            visualOffset = 0;
            // แทรกแถวใหม่ที่ด้านบนสุด
            grid.unshift(createNewRow(!grid[0].isOffset));
            // ปรับค่า Offset ทุกลูกให้ตรงตามลำดับแถวใหม่
            for(let r=0; r<grid.length; r++) {
                grid[r].forEach(b => b.isOffset = (r % 2 !== 0));
            }
        }

        function checkMatch(startR, startC) {
            let color = grid[startR][startC].color;
            let matches = [];
            let queue = [{r: startR, c: startC}];
            let visited = new Set();
            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.r},${curr.c}`;
                if (visited.has(key)) continue;
                visited.add(key);
                if (grid[curr.r] && grid[curr.r][curr.c] && grid[curr.r][curr.c].active && grid[curr.r][curr.c].color === color) {
                    matches.push(curr);
                    let off = grid[curr.r][curr.c].isOffset ? 0 : -1;
                    let neighbors = [
                        {r:curr.r, c:curr.c-1}, {r:curr.r, c:curr.c+1},
                        {r:curr.r-1, c:curr.c+off}, {r:curr.r-1, c:curr.c+off+1},
                        {r:curr.r+1, c:curr.c+off}, {r:curr.r+1, c:curr.c+off+1}
                    ];
                    neighbors.forEach(n => { if (grid[n.r] && grid[n.r][n.c]) queue.push(n); });
                }
            }
            if (matches.length >= 3) {
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 10;
                document.getElementById('score').innerText = score;
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 35;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        let isPointerDown = false;
        function updateInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY);
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        }
        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateInput(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateInput(e); });
        canvas.addEventListener('pointerup', () => { 
            if (isPointerDown && !shooter.active && !isPushing) {
                shooter.dx = Math.cos(shooter.angle) * shooter.speed;
                shooter.dy = Math.sin(shooter.angle) * shooter.speed;
                shooter.active = true;
            }
            isPointerDown = false;
        });

        initGrid();
        resetShooter();
        draw();
    </script>
</body>
</html>
