<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bubble Shooter Endless</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { background: #000; border: 4px solid #444; box-shadow: 0 0 20px rgba(0,0,0,0.8); max-width: 95vw; max-height: 85vh; }
        .ui { margin-bottom: 5px; text-align: center; width: 440px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="ui">
        <span id="score">Score: 0</span>
        <span id="next-push">Next Push: 5</span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 440;
        canvas.height = 660;

        const COLORS = ['#FF355E', '#50BFE6', '#66FF66', '#FFFF66', '#FF6037'];
        const bubbleRadius = 22;
        const rows = 14; 
        const cols = 10;
        let score = 0;
        let shotCount = 0; // นับจำนวนครั้งที่ยิง
        const pushLimit = 5; // ยิงครบ 5 ครั้งเลื่อนลง

        let grid = [];
        function initGrid() {
            for (let r = 0; r < rows; r++) {
                grid[r] = [];
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = { r, c, color: COLORS[Math.floor(Math.random() * COLORS.length)], active: r < 5 };
                }
            }
        }

        let shooter = { x: canvas.width / 2, y: canvas.height - 50, color: COLORS[0], active: false, dx: 0, dy: 0, speed: 20, angle: 0 };

        function getBubblePos(r, c) {
            let xOffset = (r % 2 === 0) ? 0 : bubbleRadius;
            return { x: c * (bubbleRadius * 2) + bubbleRadius + xOffset, y: r * (bubbleRadius * 1.7) + bubbleRadius + 10 };
        }

        function draw() {
            ctx.fillStyle = '#0b0b0b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดตาราง
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].active) {
                        let pos = getBubblePos(r, c);
                        drawBubble(pos.x, pos.y, grid[r][c].color);
                    }
                }
            }

            // เส้นเล็ง
            if (isPointerDown && !shooter.active) {
                ctx.beginPath();
                ctx.setLineDash([5, 8]);
                ctx.moveTo(shooter.x, shooter.y);
                ctx.lineTo(shooter.x + Math.cos(shooter.angle) * 150, shooter.y + Math.sin(shooter.angle) * 150);
                ctx.strokeStyle = "white";
                ctx.stroke();
                ctx.setLineDash([]);
            }

            drawBubble(shooter.x, shooter.y, shooter.color);

            if (shooter.active) {
                shooter.x += shooter.dx;
                shooter.y += shooter.dy;
                if (shooter.x < bubbleRadius || shooter.x > canvas.width - bubbleRadius) shooter.dx *= -1;
                handleCollision();
            }
            requestAnimationFrame(draw);
        }

        function drawBubble(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, bubbleRadius - 2, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.stroke();
        }

        function handleCollision() {
            let hit = (shooter.y < bubbleRadius);
            if (!hit) {
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            if (Math.hypot(shooter.x - pos.x, shooter.y - pos.y) < bubbleRadius * 1.5) { hit = true; break; }
                        }
                    }
                }
            }

            if (hit) {
                let bestFit = { r: 0, c: 0, dist: 9999 };
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (!grid[r][c].active) {
                            let pos = getBubblePos(r, c);
                            let d = Math.hypot(shooter.x - pos.x, shooter.y - pos.y);
                            if (d < bestFit.dist) bestFit = { r, c, dist: d };
                        }
                    }
                }
                grid[bestFit.r][bestFit.c].active = true;
                grid[bestFit.r][bestFit.c].color = shooter.color;
                
                checkMatch(bestFit.r, bestFit.c);
                
                shotCount++;
                document.getElementById('next-push').innerText = `Next Push: ${pushLimit - shotCount}`;
                if (shotCount >= pushLimit) {
                    pushRowsDown();
                    shotCount = 0;
                    document.getElementById('next-push').innerText = `Next Push: ${pushLimit}`;
                }

                if (bestFit.r >= rows - 2) { alert("Game Over!"); initGrid(); score = 0; }
                resetShooter();
            }
        }

        function pushRowsDown() {
            // เลื่อนข้อมูลใน Grid ลงมา 1 แถว
            for (let r = rows - 1; r > 0; r--) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c].active = grid[r-1][c].active;
                    grid[r][c].color = grid[r-1][c].color;
                }
            }
            // เพิ่มแถวใหม่ข้างบน
            for (let c = 0; c < cols; c++) {
                grid[0][c].active = true;
                grid[0][c].color = COLORS[Math.floor(Math.random() * COLORS.length)];
            }
        }

        function checkMatch(startR, startC) {
            let color = grid[startR][startC].color;
            let matches = [];
            let queue = [{r: startR, c: startC}];
            let visited = new Set();
            while (queue.length > 0) {
                let curr = queue.shift();
                let key = `${curr.r},${curr.c}`;
                if (visited.has(key)) continue;
                visited.add(key);
                if (grid[curr.r] && grid[curr.r][curr.c] && grid[curr.r][curr.c].active && grid[curr.r][curr.c].color === color) {
                    matches.push(curr);
                    let rowOffset = curr.r % 2 === 0 ? -1 : 0;
                    let neighbors = [{r:curr.r, c:curr.c-1}, {r:curr.r, c:curr.c+1}, {r:curr.r-1, c:curr.c+rowOffset}, {r:curr.r-1, c:curr.c+rowOffset+1}, {r:curr.r+1, c:curr.c+rowOffset}, {r:curr.r+1, c:curr.c+rowOffset+1}];
                    neighbors.forEach(n => { if (grid[n.r] && grid[n.r][n.c]) queue.push(n); });
                }
            }
            if (matches.length >= 3) {
                matches.forEach(m => grid[m.r][m.c].active = false);
                score += matches.length * 10;
                document.getElementById('score').innerText = `Score: ${score}`;
            }
        }

        function resetShooter() {
            shooter.active = false;
            shooter.x = canvas.width / 2;
            shooter.y = canvas.height - 50;
            shooter.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        }

        let isPointerDown = false;
        const updateInput = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            shooter.angle = Math.atan2((clientY - rect.top) - shooter.y, (clientX - rect.left) - shooter.x);
        };
        canvas.addEventListener('pointerdown', (e) => { isPointerDown = true; updateInput(e); });
        canvas.addEventListener('pointermove', (e) => { if (isPointerDown) updateInput(e); });
        canvas.addEventListener('pointerup', () => { if (isPointerDown && !shooter.active) { shooter.dx = Math.cos(shooter.angle) * shooter.speed; shooter.dy = Math.sin(shooter.angle) * shooter.speed; shooter.active = true; } isPointerDown = false; });

        initGrid();
        resetShooter();
        draw();
    </script>
</body>
</html>
