<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Pastry Chef - เกมทำขนม</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8fab;
            --secondary: #fb6f92;
            --bg: #ffe5ec;
            --dark: #4a4e69;
            --success: #7ae582;
            --error: #ff6b6b;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Adjust to flex-start for longer content */
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .game-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 800px; /* Increased max-width */
            width: 100%;
            text-align: center;
        }

        h1 { 
            color: var(--secondary); 
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        h2 { 
            color: var(--primary); 
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        /* --- Menu Selection Screen --- */
        #menu-selection-screen .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); /* Responsive grid */
            gap: 15px;
            margin-top: 30px;
        }

        #menu-selection-screen .menu-item {
            cursor: pointer;
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 10px;
            transition: all 0.2s;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #menu-selection-screen .menu-item:hover {
            background-color: var(--primary);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #menu-selection-screen .menu-item:hover img {
            filter: brightness(0) invert(1); /* Invert image color on hover if it's an icon */
        }
        
        #menu-selection-screen .menu-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #eee; /* Light border for images */
        }
        #menu-selection-screen .menu-item span {
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* --- Baking Screen --- */
        #baking-screen { display: none; }
        .target-menu-display { 
            font-size: 1.8rem; 
            font-weight: bold; 
            color: #ff477e; 
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .target-menu-display img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            margin-right: 15px;
            border: 2px solid var(--primary);
        }

        .ingredient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); /* More flexible grid */
            gap: 10px;
            margin-top: 20px;
        }

        button.ingredient {
            padding: 15px;
            border: 2px solid var(--primary);
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
            font-weight: 400;
        }

        button.ingredient:hover { background: var(--primary); color: white; }
        button.ingredient.selected { background: var(--primary); color: white; border-color: var(--secondary); pointer-events: none; }
        button.ingredient.correct { background: var(--success); border-color: darken(var(--success), 10%); color: white; pointer-events: none; }
        button.ingredient.incorrect { background: var(--error); border-color: darken(var(--error), 10%); color: white; pointer-events: none; }
        button.ingredient.disabled { pointer-events: none; opacity: 0.6; } /* For when game ends */
        
        .status-msg { 
            margin-top: 20px; 
            font-weight: bold; 
            min-height: 24px; 
            font-size: 1.2rem;
        }
        .progress { margin: 10px 0; color: #888; font-size: 1.1rem; }
        
        /* --- Result Screen --- */
        #result-screen { display: none; }
        #result-message { 
            font-size: 2rem; 
            font-weight: bold; 
            margin-bottom: 20px;
        }
        #result-screen img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid var(--primary);
        }

        .action-button {
            margin-top: 20px;
            padding: 12px 25px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: background-color 0.2s;
        }
        .action-button:hover { background-color: #e65279; }

        /* General utility classes */
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div class="game-container">
        <h1>👩‍🍳 Master Pastry Chef 🍰</h1>

        <div id="menu-selection-screen">
            <h2>เลือกเมนูขนมที่อยากทำ</h2>
            <div id="menu-grid" class="menu-grid">
                </div>
        </div>

        <div id="baking-screen" class="hidden">
            <div class="target-menu-display">
                <img id="baking-menu-image" src="" alt="ขนมที่กำลังทำ">
                <span id="baking-menu-name"></span>
            </div>
            <p>เลือกวัตถุดิบ 6 อย่างให้ถูกต้อง:</p>
            <div class="progress" id="progress">วัตถุดิบที่เลือกได้: 0 / 6</div>
            
            <div id="ingredient-grid" class="ingredient-grid">
                </div>

            <div id="message" class="status-msg"></div>
            <button id="back-to-menu-btn" class="action-button hidden" onclick="showScreen('menu-selection-screen')">กลับไปเลือกเมนู</button>
        </div>

        <div id="result-screen" class="hidden">
            <img id="result-menu-image" src="" alt="ผลลัพธ์">
            <div id="result-message"></div>
            <button class="action-button" onclick="showScreen('menu-selection-screen')">ทำเมนูอื่น</button>
        </div>
    </div>

    <script>
        const recipes = [
            { id: 'cake', name: "เค้กช็อกโกแลต", image: "https://via.placeholder.com/100/ff8fab/fff?text=Cake", ingredients: ["แป้งเค้ก", "ผงโกโก้", "ไข่ไก่", "เนยจืด", "น้ำตาลทราย", "นมสด"] },
            { id: 'macaron', name: "มาการอง", image: "https://via.placeholder.com0/ff8fab/fff?text=Macaron", ingredients: ["ผงอัลมอนด์", "น้ำตาลไอซิ่ง", "ไข่ขาว", "น้ำตาลทราย", "กลิ่นวานิลลา", "สีผสมอาหาร"] },
            { id: 'applepie', name: "พายแอปเปิ้ล", image: "https://via.placeholder.com/100/ff8fab/fff?text=ApplePie", ingredients: ["แป้งอเนกประสงค์", "เนยเย็น", "แอปเปิ้ล", "อบเชย", "น้ำตาลทรายแดง", "น้ำเย็น"] },
            { id: 'croissant', name: "ครัวซองต์", image: "https://via.placeholder.com/100/ff8fab/fff?text=Croissant", ingredients: ["แป้งขนมปัง", "ยีสต์", "เนยแท้", "เกลือ", "น้ำตาล", "นมเย็น"] },
            { id: 'cheesecake', name: "ชีสเค้กหน้าไหม้", image: "https://via.placeholder.com/100/ff8fab/fff?text=Cheese", ingredients: ["ครีมชีส", "วิปปิ้งครีม", "น้ำตาล", "ไข่ไก่", "แป้งข้าวโพด", "กลิ่นวานิลลา"] },
            { id: 'cookies', name: "คุกกี้ช็อกโกแลตชิพ", image: "https://via.placeholder.com/100/ff8fab/fff?text=Cookie", ingredients: ["เนยละลาย", "น้ำตาลทรายแดง", "ไข่ไก่", "แป้งอเนกประสงค์", "ช็อกโกแลตชิพ", "เบกกิ้งโซดา"] },
            { id: 'brownie', name: "บราวนี่", image: "https://via.placeholder.com/100/ff8fab/fff?text=Brownie", ingredients: ["ช็อกโกแลตแท้", "เนย", "น้ำตาล", "ไข่ไก่", "แป้งอเนกประสงค์", "เกลือ"] },
            { id: 'eclair', name: "เอแคลร์", image: "https://via.placeholder.com/100/ff8fab/fff?text=Eclair", ingredients: ["แป้งพัฟ", "เนย", "ไข่ไก่", "น้ำ", "ครีมคัสตาร์ด", "เกลือ"] },
            { id: 'eggtart', name: "ทาร์ตไข่", image: "https://via.placeholder.com/100/ff8fab/fff?text=EggTart", ingredients: ["แป้งพายชั้น", "ไข่แดง", "วิปปิ้งครีม", "นมสด", "น้ำตาล", "กลิ่นวานิลลา"] },
            { id: 'donut', name: "โดนัท", image: "https://via.placeholder.com/100/ff8fab/fff?text=Donut", ingredients: ["แป้งขนมปัง", "ยีสต์", "นมสด", "เนย", "น้ำตาล", "น้ำมันพืช"] },
            { id: 'pancake', name: "แพนเค้ก", image: "https://via.placeholder.com/100/ff8fab/fff?text=Pancake", ingredients: ["แป้ง", "นมสด", "ไข่ไก่", "ผงฟู", "เนยละลาย", "น้ำผึ้ง"] },
            { id: 'waffle', name: "วาฟเฟิล", image: "https://via.placeholder.com/100/ff8fab/fff?text=Waffle", ingredients: ["แป้ง", "นมสด", "ไข่ไก่", "น้ำตาล", "เนยละลาย", "ยีสต์"] },
            { id: 'blueberrypie', name: "บลูเบอร์รี่ชีสพาย", image: "https://via.placeholder.com/100/ff8fab/fff?text=Blueberry", ingredients: ["แครกเกอร์", "เนยละลาย", "ครีมชีส", "นมข้นหวาน", "มะนาว", "บลูเบอร์รี่ซอส"] },
            { id: 'tiramisu', name: "ทีรามิสุ", image: "https://via.placeholder.com/100/ff8fab/fff?text=Tiramisu", ingredients: ["เลดี้ฟิงเกอร์", "กาแฟ", "มาสคาร์โปเน่", "ไข่แดง", "ผงโกโก้", "เหล้ารัม"] },
            { id: 'custard', name: "พุดดิ้งคัสตาร์ด", image: "https://via.placeholder.com/100/ff8fab/fff?text=Custard", ingredients: ["ไข่ไก่", "นมสด", "น้ำตาลทราย", "น้ำ", "กลิ่นวานิลลา", "วิปครีม"] },
            { id: 'muffin', name: "มัฟฟินกล้วยหอม", image: "https://via.placeholder.com/100/ff8fab/fff?text=Muffin", ingredients: ["กล้วยหอม", "แป้งอเนกประสงค์", "ไข่ไก่", "น้ำมัน", "เบกกิ้งโซดา", "น้ำตาลแดง"] },
            { id: 'scone', name: "สโคน", image: "https://via.placeholder.com/100/ff8fab/fff?text=Scone", ingredients: ["แป้งอเนกประสงค์", "เนยเย็น", "ผงฟู", "ครีมสด", "ไข่ไก่", "ลูกเกด"] },
            { id: 'jamroll', name: "แยมโรล", image: "https://via.placeholder.com/100/ff8fab/fff?text=JamRoll", ingredients: ["แป้งเค้ก", "ไข่ไก่", "น้ำตาล", "นม", "แยม", "น้ำมันพืช"] },
            { id: 'buttercake', name: "บัตเตอร์เค้ก", image: "https://via.placeholder.com/100/ff8fab/fff?text=ButterCake", ingredients: ["เนยสด", "แป้งเค้ก", "ไข่ไก่", "น้ำตาล", "นมสด", "ผงฟู"] },
            { id: 'applecrumble', name: "แอปเปิ้ลครัมเบิล", image: "https://via.placeholder.com/100/ff8fab/fff?text=Crumble", ingredients: ["แอปเปิ้ล", "แป้ง", "เนย", "น้ำตาลทรายแดง", "อบเชย", "ข้าวโอ๊ต"] }
        ];

        // วัตถุดิบหลอก (สามารถเพิ่มได้อีก)
        const fakeIngredients = ["พริกแกง", "ปลาทู", "ซอสหอยนางรม", "น้ำปลาร้า", "กะปิ", "ต้นหอม", "พริกป่น", "น้ำมันงา", "เต้าเจี้ยว", "หมูสับ"];
        
        let currentRecipe = null;
        let selectedCorrectIngredients = [];
        let gameActive = false;

        // --- Screen Management ---
        function showScreen(screenId) {
            document.getElementById('menu-selection-screen').classList.add('hidden');
            document.getElementById('baking-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
        }

        // --- Menu Selection Screen Functions ---
        function loadMenuSelection() {
            const menuGrid = document.getElementById('menu-grid');
            menuGrid.innerHTML = ''; // Clear previous items

            recipes.forEach(recipe => {
                const menuItem = document.createElement('div');
                menuItem.className = 'menu-item';
                menuItem.onclick = () => selectRecipe(recipe);
                menuItem.innerHTML = `
                    <img src="${recipe.image}" alt="${recipe.name}">
                    <span>${recipe.name}</span>
                `;
                menuGrid.appendChild(menuItem);
            });
            showScreen('menu-selection-screen');
        }

        function selectRecipe(recipe) {
            currentRecipe = recipe;
            startBakingGame();
        }

        // --- Baking Screen Functions ---
        function startBakingGame() {
            selectedCorrectIngredients = [];
            gameActive = true;
            document.getElementById('message').innerText = "";
            document.getElementById('progress').innerText = `วัตถุดิบที่เลือกได้: 0 / 6`;
            document.getElementById('back-to-menu-btn').classList.add('hidden'); // Hide back button initially

            // Update baking screen UI
            document.getElementById('baking-menu-name').innerText = currentRecipe.name;
            document.getElementById('baking-menu-image').src = currentRecipe.image;
            document.getElementById('baking-menu-image').alt = currentRecipe.name;

            // Prepare ingredients for selection
            let options = [...currentRecipe.ingredients];
            // Add fake ingredients, ensuring no duplicates with correct ones
            let tempFakeIngredients = fakeIngredients.filter(item => !currentRecipe.ingredients.includes(item));
            options = options.concat(tempFakeIngredients.slice(0, 6)); // 6 correct + 6 fake = 12 total options
            
            options.sort(() => Math.random() - 0.5); // Shuffle

            const ingredientGrid = document.getElementById('ingredient-grid');
            ingredientGrid.innerHTML = '';
            options.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'ingredient';
                btn.innerText = item;
                btn.onclick = () => checkIngredient(item, btn);
                ingredientGrid.appendChild(btn);
            });
            showScreen('baking-screen');
        }

        function checkIngredient(item, btn) {
            if (!gameActive) return; // Prevent clicks after game ends

            if (currentRecipe.ingredients.includes(item)) {
                if (!selectedCorrectIngredients.includes(item)) { // Ensure item not selected twice
                    btn.classList.add('correct');
                    btn.classList.add('selected'); // Also mark as selected
                    selectedCorrectIngredients.push(item);
                    document.getElementById('progress').innerText = `วัตถุดิบที่เลือกได้: ${selectedCorrectIngredients.length} / 6`;
                    
                    if (selectedCorrectIngredients.length === 6) {
                        document.getElementById('message').innerText = "✨ ยอดเยี่ยม! ทำสำเร็จแล้ว ขนมน่าทานมาก!";
                        document.getElementById('message').style.color = "green";
                        endGame(true);
                    }
                }
            } else {
                btn.classList.add('incorrect');
                document.getElementById('message').innerText = `❌ ว้าย! ${item} ไม่ใช่ส่วนผสมของ ${currentRecipe.name} ขนมพังหมดเลย!`;
                document.getElementById('message').style.color = "red";
                endGame(false);
            }
        }

        function endGame(isSuccess) {
            gameActive = false;
            const buttons = document.querySelectorAll('#ingredient-grid .ingredient');
            buttons.forEach(b => {
                b.classList.add('disabled'); // Disable all buttons
                if (currentRecipe.ingredients.includes(b.innerText) && !b.classList.contains('correct')) {
                    // Highlight correct ones that were missed if the player failed
                    b.style.border = '2px solid var(--success)';
                }
            });

            // Show result screen after a short delay
            setTimeout(() => showResultScreen(isSuccess), 1500);
        }

        // --- Result Screen Functions ---
        function showResultScreen(isSuccess) {
            const resultMessage = document.getElementById('result-message');
            const resultImage = document.getElementById('result-menu-image');

            resultImage.src = currentRecipe.image;
            resultImage.alt = currentRecipe.name;
            resultImage.style.borderColor = isSuccess ? 'var(--success)' : 'var(--error)';

            if (isSuccess) {
                resultMessage.innerText = `🎉 ยอดเยี่ยม! คุณทำ ${currentRecipe.name} สำเร็จ!`;
                resultMessage.style.color = 'var(--success)';
            } else {
                resultMessage.innerText = `😢 เสียใจด้วย! คุณทำ ${currentRecipe.name} ไม่สำเร็จ...`;
                resultMessage.style.color = 'var(--error)';
            }
            showScreen('result-screen');
        }

        // Initialize the game
        loadMenuSelection();
    </script>
</body>
</html>
