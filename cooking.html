<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Pastry Chef - เกมทำขนม</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff8fab;
            --secondary: #fb6f92;
            --bg: #ffe5ec;
            --dark: #4a4e69;
            --success: #7ae582;
            --error: #ff6b6b;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-color: var(--bg);
            color: var(--dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: white;
            padding: 2rem;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        h1 { color: var(--secondary); margin-bottom: 10px; font-size: 2.2rem; }
        
        /* สไตล์หน้าเลือกเมนู */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .menu-item {
            background: #fff0f3;
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-item:hover {
            transform: scale(1.05);
            background: var(--primary);
            color: white;
        }

        .menu-emoji { font-size: 3rem; display: block; margin-bottom: 5px; }

        /* สไตล์หน้าทำขนม */
        .baking-header { font-size: 1.5rem; margin-bottom: 20px; background: #fff0f3; padding: 15px; border-radius: 15px; }
        .progress-bar { font-size: 1.1rem; color: var(--secondary); margin-bottom: 15px; font-weight: bold; }

        .ingredient-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .btn-ingredient {
            padding: 12px 5px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Kanit';
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-ingredient:hover { border-color: var(--primary); background: #fff0f3; }
        .btn-ingredient.correct { background: var(--success) !important; color: white; border-color: #2dc653; }
        .btn-ingredient.wrong { background: var(--error) !important; color: white; border-color: #d90429; }

        .hidden { display: none !important; }
        
        .result-overlay {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .btn-main {
            margin-top: 20px;
            padding: 12px 30px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>👩‍🍳 Master Pastry Chef</h1>

    <div id="screen-menu">
        <p>เลือกเมนูที่คุณต้องการจะทำวันนี้:</p>
        <div id="menu-list" class="menu-grid"></div>
    </div>

    <div id="screen-game" class="hidden">
        <div class="baking-header">
            กำลังทำ: <span id="target-emoji"></span> <span id="target-name"></span>
        </div>
        <div id="progress" class="progress-bar">เลือกวัตถุดิบ: 0 / 6</div>
        <div id="ingredient-list" class="ingredient-grid"></div>
        <div id="game-message" class="result-overlay"></div>
        <button id="btn-retry" class="btn-main hidden" onclick="resetToMenu()">กลับไปหน้าเลือกเมนู</button>
    </div>
</div>

<script>
    const recipes = [
        { name: "เค้กช็อกโกแลต", emoji: "🎂", ingredients: ["แป้งเค้ก", "ผงโกโก้", "ไข่ไก่", "เนยจืด", "น้ำตาลทราย", "นมสด"] },
        { name: "มาการอง", emoji: "🧁", ingredients: ["ผงอัลมอนด์", "น้ำตาลไอซิ่ง", "ไข่ขาว", "น้ำตาลทราย", "กลิ่นวานิลลา", "สีผสมอาหาร"] },
        { name: "พายแอปเปิ้ล", emoji: "🥧", ingredients: ["แป้งอเนกประสงค์", "เนยเย็น", "แอปเปิ้ล", "อบเชย", "น้ำตาลทรายแดง", "น้ำเย็น"] },
        { name: "ครัวซองต์", emoji: "🥐", ingredients: ["แป้งขนมปัง", "ยีสต์", "เนยแท้", "เกลือ", "น้ำตาล", "นมเย็น"] },
        { name: "ชีสเค้ก", emoji: "🍰", ingredients: ["ครีมชีส", "วิปปิ้งครีม", "น้ำตาล", "ไข่ไก่", "แป้งข้าวโพด", "กลิ่นวานิลลา"] },
        { name: "คุกกี้", emoji: "🍪", ingredients: ["เนยละลาย", "น้ำตาลทรายแดง", "ไข่ไก่", "แป้งอเนกประสงค์", "ช็อกโกแลตชิพ", "เบกกิ้งโซดา"] },
        { name: "บราวนี่", emoji: "🍫", ingredients: ["ช็อกโกแลตแท้", "เนย", "น้ำตาล", "ไข่ไก่", "แป้งอเนกประสงค์", "เกลือ"] },
        { name: "โดนัท", emoji: "🍩", ingredients: ["แป้งขนมปัง", "ยีสต์", "นมสด", "เนย", "น้ำตาล", "น้ำมันพืช"] },
        { name: "แพนเค้ก", emoji: "🥞", ingredients: ["แป้ง", "นมสด", "ไข่ไก่", "ผงฟู", "เนยละลาย", "น้ำผึ้ง"] },
        { name: "วาฟเฟิล", emoji: "🧇", ingredients: ["แป้ง", "นมสด", "ไข่ไก่", "น้ำตาล", "เนยละลาย", "ยีสต์"] },
        { name: "ทีรามิสุ", emoji: "☕", ingredients: ["เลดี้ฟิงเกอร์", "กาแฟ", "มาสคาร์โปเน่", "ไข่แดง", "ผงโกโก้", "เหล้ารัม"] },
        { name: "ทาร์ตไข่", emoji: "🥧", ingredients: ["แป้งพายชั้น", "ไข่แดง", "วิปปิ้งครีม", "นมสด", "น้ำตาล", "กลิ่นวานิลลา"] },
        { name: "พุดดิ้ง", emoji: "🍮", ingredients: ["ไข่ไก่", "นมสด", "น้ำตาลทราย", "น้ำ", "กลิ่นวานิลลา", "วิปครีม"] },
        { name: "มัฟฟิน", emoji: "🧁", ingredients: ["กล้วยหอม", "แป้งอเนกประสงค์", "ไข่ไก่", "น้ำมัน", "เบกกิ้งโซดา", "น้ำตาลแดง"] },
        { name: "สโคน", emoji: "🍪", ingredients: ["แป้งอเนกประสงค์", "เนยเย็น", "ผงฟู", "ครีมสด", "ไข่ไก่", "ลูกเกด"] },
        { name: "แยมโรล", emoji: "🍥", ingredients: ["แป้งเค้ก", "ไข่ไก่", "น้ำตาล", "นม", "แยม", "น้ำมันพืช"] },
        { name: "บัตเตอร์เค้ก", emoji: "🧈", ingredients: ["เนยสด", "แป้งเค้ก", "ไข่ไก่", "น้ำตาล", "นมสด", "ผงฟู"] },
        { name: "ขนมปังปิ้ง", emoji: "🍞", ingredients: ["ขนมปัง", "เนยเค็ม", "น้ำตาลทราย", "นมข้นหวาน", "สังขยา", "น้ำมัน"] },
        { name: "ไอศกรีมทอด", emoji: "🍨", ingredients: ["ไอศกรีม", "ขนมปัง", "แป้งทอดกรอบ", "น้ำมันพืช", "เกล็ดขนมปัง", "ไข่ไก่"] },
        { name: "โมจิ", emoji: "🍡", ingredients: ["แป้งข้าวเหนียว", "น้ำตาล", "แป้งมัน", "ถั่วแดง", "น้ำ", "สีผสมอาหาร"] }
    ];

    const distractors = ["พริก", "น้ำปลา", "ซีอิ๊ว", "กระเทียม", "กุ้งสด", "ผักชี", "หอมหัวใหญ่", "เนื้อหมู"];
    
    let currentRecipe = null;
    let score = 0;
    let isGameOver = false;

    // สร้างเมนูหน้าแรก
    function initMenu() {
        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = '';
        recipes.forEach((recipe, index) => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            div.innerHTML = `<span class="menu-emoji">${recipe.emoji}</span><span>${recipe.name}</span>`;
            div.onclick = () => startBaking(index);
            menuList.appendChild(div);
        });
    }

    // เริ่มทำขนม
    function startBaking(index) {
        currentRecipe = recipes[index];
        score = 0;
        isGameOver = false;
        
        document.getElementById('screen-menu').classList.add('hidden');
        document.getElementById('screen-game').classList.remove('hidden');
        document.getElementById('btn-retry').classList.add('hidden');
        document.getElementById('game-message').innerText = '';
        
        document.getElementById('target-name').innerText = currentRecipe.name;
        document.getElementById('target-emoji').innerText = currentRecipe.emoji;
        updateProgress();
        renderIngredients();
    }

    // สุ่มวัตถุดิบมาให้เลือก
    function renderIngredients() {
        const list = document.getElementById('ingredient-list');
        list.innerHTML = '';
        
        // รวมของจริง + ของหลอก
        let options = [...currentRecipe.ingredients, ...distractors.slice(0, 3)];
        options = options.sort(() => Math.random() - 0.5); // Shuffle

        options.forEach(ing => {
            const btn = document.createElement('button');
            btn.className = 'btn-ingredient';
            btn.innerText = ing;
            btn.onclick = () => selectIngredient(ing, btn);
            list.appendChild(btn);
        });
    }

    // ตรวจสอบสิ่งที่เลือก
    function selectIngredient(ing, btn) {
        if (isGameOver) return;

        if (currentRecipe.ingredients.includes(ing)) {
            if (!btn.classList.contains('correct')) {
                btn.classList.add('correct');
                score++;
                updateProgress();
                if (score === 6) {
                    winGame();
                }
            }
        } else {
            btn.classList.add('wrong');
            loseGame(ing);
        }
    }

    function updateProgress() {
        document.getElementById('progress').innerText = `เลือกวัตถุดิบที่ถูกต้อง: ${score} / 6`;
    }

    function winGame() {
        isGameOver = true;
        const msg = document.getElementById('game-message');
        msg.innerText = "✨ สุดยอด! คุณทำ " + currentRecipe.name + " สำเร็จแล้ว!";
        msg.style.color = "green";
        document.getElementById('btn-retry').classList.remove('hidden');
    }

    function loseGame(ing) {
        isGameOver = true;
        const msg = document.getElementById('game-message');
        msg.innerText = "❌ พลาดแล้ว! " + ing + " ไม่ใส่ในนี้ ขนมพังหมดเลย!";
        msg.style.color = "red";
        document.getElementById('btn-retry').classList.remove('hidden');
    }

    function resetToMenu() {
        document.getElementById('screen-menu').classList.remove('hidden');
        document.getElementById('screen-game').classList.add('hidden');
    }

    // เริ่มต้นแอป
    initMenu();
</script>

</body>
</html>
