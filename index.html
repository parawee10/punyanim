<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Paravee</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; background: #4ec0ca; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { display: block; background: #70c5ce; border: 5px solid #fff; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.3); }
        
        /* หน้าเมนูผู้จัดทำ */
        #start-screen {
            position: absolute; width: 100%; height: 100%;
            background: rgba(78, 192, 202, 1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; text-align: center; color: white;
        }
        .card { background: white; padding: 40px; border-radius: 25px; color: #333; box-shadow: 0 10px 0 #3a9199; }
        .btn-entry {
            margin-top: 25px; padding: 15px 50px; font-size: 22px;
            background: #ff9d00; color: white; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 0 #b36e00; transition: 0.1s;
        }
        .btn-entry:active { transform: translateY(3px); box-shadow: 0 2px 0 #b36e00; }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="card">
            <h1 style="margin: 0; color: #4ec0ca;">FLAPPY BIRD</h1>
            <p style="font-size: 18px; margin: 10px 0;">ผู้จัดทำ</p>
            <h2 style="margin: 5px 0;">ด.ญ.ปารวีย์ ศรีสวัสดิ์</h2>
            <p style="margin: 0;">ชั้น ม.2/2 เลขที่ 25</p>
            <button class="btn-entry" onclick="entryGame()">เข้าสู่เกม</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const startScreen = document.getElementById("start-screen");

        canvas.width = 360;
        canvas.height = 500;

        // ตัวแปรสถานะ
        let gameState = "MENU"; // MENU, READY, PLAYING
        let bird, pipes, frame, score;

        const gravity = 0.5;
        const lift = -8;
        const pipeWidth = 55;
        const pipeGap = 150;      // ความห่างระหว่างเสาบน-ล่าง (พอดีๆ)
        const pipeInterval = 90;  // ความถี่ในการปล่อยเสา (ไม่ชิดไม่ห่างเกินไป)

        function init() {
            bird = { x: 60, y: canvas.height / 2, w: 34, h: 24, velocity: 0 };
            pipes = [];
            frame = 0;
            score = 0;
        }

        function entryGame() {
            startScreen.style.display = "none";
            gameState = "READY";
            init();
            draw();
        }

        function createPipe() {
            let minH = 50;
            let maxH = canvas.height - pipeGap - minH;
            let topH = Math.floor(Math.random() * (maxH - minH + 1)) + minH;
            pipes.push({ x: canvas.width, top: topH });
        }

        function jump() {
            if (gameState === "READY") {
                gameState = "PLAYING";
            }
            if (gameState === "PLAYING") {
                bird.velocity = lift;
            }
        }

        function draw() {
            // ล้างหน้าจอ
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดพื้นหลังจำลอง (เส้นหญ้า)
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

            // วาดนก
            ctx.fillStyle = "#f1c40f";
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 2;
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
            ctx.strokeRect(bird.x, bird.y, bird.w, bird.h);

            if (gameState === "PLAYING") {
                bird.velocity += gravity;
                bird.y += bird.velocity;

                if (frame % pipeInterval === 0) createPipe();

                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= 2.5;

                    ctx.fillStyle = "#2ecc71";
                    ctx.strokeRect(pipes[i].x, 0, pipeWidth, pipes[i].top); // บน
                    ctx.fillRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
                    
                    ctx.strokeRect(pipes[i].x, pipes[i].top + pipeGap, pipeWidth, canvas.height); // ล่าง
                    ctx.fillRect(pipes[i].x, pipes[i].top + pipeGap, pipeWidth, canvas.height);

                    // ชนเสา
                    if (bird.x < pipes[i].x + pipeWidth && bird.x + bird.w > pipes[i].x &&
                        (bird.y < pipes[i].top || bird.y + bird.h > pipes[i].top + pipeGap)) {
                        resetToMenu();
                    }
                    // ได้คะแนน
                    if (pipes[i].x + pipeWidth === Math.floor(bird.x)) score++;
                    // ลบท่อที่เลยหน้าจอ
                    if (pipes[i].x + pipeWidth < 0) pipes.splice(i, 1);
                }

                if (bird.y + bird.h > canvas.height || bird.y < 0) resetToMenu();
                frame++;
            } else if (gameState === "READY") {
                // ตัวหนังสือกดเพื่อเริ่ม
                ctx.fillStyle = "white";
                ctx.font = "20px Arial";
                ctx.textAlign = "center";
                ctx.fillText("แตะหน้าจอเพื่อเริ่มบิน", canvas.width / 2, canvas.height / 2 + 60);
            }

            // คะแนน
            ctx.fillStyle = "white";
            ctx.font = "bold 35px Arial";
            ctx.textAlign = "left";
            ctx.fillText(score, 20, 50);

            if (gameState !== "MENU") requestAnimationFrame(draw);
        }

        function resetToMenu() {
            gameState = "MENU";
            startScreen.style.display = "flex";
            document.querySelector('h1').innerText = "GAME OVER";
            document.querySelector('.btn-entry').innerText = "ลองอีกครั้ง";
        }

        // ฟังชันก์การควบคุม
        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { jump(); e.preventDefault(); }, {passive: false});
        canvas.addEventListener("mousedown", (e) => { jump(); });

    </script>
</body>
</html>
