<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: #70c5ce; }
        canvas { display: block; margin: 0 auto; background: #70c5ce; border: 2px solid #000; }
        #credits {
            text-align: center;
            background: white;
            padding: 15px;
            border-top: 5px solid #ff9d00;
        }
        h2 { color: #333; margin: 5px 0; }
        p { font-size: 1.2rem; color: #555; margin: 5px 0; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="credits">
        <h2>ผู้จัดทำ</h2>
        <p><strong>ด.ญ.ปารวีย์ ศรีสวัสดิ์</strong></p>
        <p>ชั้น ม.2/2 เลขที่ 25</p>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // ปรับขนาดหน้าจอให้เหมาะกับมือถือและคอม
        canvas.width = window.innerWidth > 400 ? 400 : window.innerWidth;
        canvas.height = 500;

        // ตัวแปรเกม
        let bird = { x: 50, y: 150, width: 34, height: 24, gravity: 0.6, lift: -10, velocity: 0 };
        let pipes = [];
        let frame = 0;
        let score = 0;
        let gameOver = false;

        function createPipe() {
            let gap = 120;
            let minPipeHeight = 50;
            let height = Math.floor(Math.random() * (canvas.height - gap - (minPipeHeight * 2))) + minPipeHeight;
            pipes.push({ x: canvas.width, top: height, bottom: canvas.height - height - gap });
        }

        function draw() {
            // พื้นหลัง
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดนก
            ctx.fillStyle = "#f8e71c";
            ctx.fillRect(bird.x, bird.y, bird.width, bird.height);

            // ฟิสิกส์นก
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // วาดท่อ
            ctx.fillStyle = "#2ecc71";
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2;

                // ท่อบน
                ctx.fillRect(pipes[i].x, 0, 50, pipes[i].top);
                // ท่อล่าง
                ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, 50, pipes[i].bottom);

                // ตรวจสอบการชน
                if (
                    bird.x < pipes[i].x + 50 &&
                    bird.x + bird.width > pipes[i].x &&
                    (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
                ) {
                    resetGame();
                }

                // นับคะแนน
                if (pipes[i].x === bird.x) {
                    score++;
                }

                // ลบท่อที่หลุดหน้าจอ
                if (pipes[i].x + 50 < 0) {
                    pipes.splice(i, 1);
                }
            }

            // ตรวจสอบขอบหน้าจอ
            if (bird.y + bird.height > canvas.height || bird.y < 0) {
                resetGame();
            }

            // เพิ่มท่อใหม่
            if (frame % 100 === 0) {
                createPipe();
            }

            // แสดงคะแนน
            ctx.fillStyle = "white";
            ctx.font = "30px Arial";
            ctx.fillText("Score: " + score, 20, 40);

            frame++;
            if (!gameOver) requestAnimationFrame(draw);
        }

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frame = 0;
        }

        function jump() {
            bird.velocity = bird.lift;
        }

        // การควบคุม
        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        window.addEventListener("touchstart", (e) => { jump(); e.preventDefault(); }, {passive: false});

        createPipe();
        draw();
    </script>
</body>
</html>
