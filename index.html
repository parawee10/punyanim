<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Paravee</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Tahoma', sans-serif; background: #4ec0ca; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { display: block; background: #70c5ce; border: 5px solid #fff; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.3); touch-action: manipulation; }
        
        #overlay {
            position: absolute; width: 100%; height: 100%;
            background: rgba(78, 192, 202, 1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 100; text-align: center; color: white;
        }
        .card { background: white; padding: 30px; border-radius: 25px; color: #333; box-shadow: 0 10px 0 #3a9199; min-width: 250px; }
        .btn-action {
            margin-top: 20px; padding: 12px 40px; font-size: 20px;
            background: #ff9d00; color: white; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold;
            box-shadow: 0 5px 0 #b36e00; transition: 0.1s;
        }
        .btn-action:active { transform: translateY(3px); box-shadow: 0 2px 0 #b36e00; }
    </style>
</head>
<body>

    <div id="overlay">
        <div class="card" id="menu-content">
            <div id="info-section">
                <h1 style="margin: 0; color: #4ec0ca;">FLAPPY BIRD</h1>
                <p style="font-size: 16px; margin: 10px 0;">ผู้จัดทำ</p>
                <h2 style="margin: 5px 0;">ด.ญ.ปารวีย์ ศรีสวัสดิ์</h2>
                <p style="margin: 0;">ชั้น ม.2/2 เลขที่ 25</p>
            </div>
            <div id="gameover-section" style="display:none;">
                <h1 style="margin: 0; color: #e74c3c;">GAME OVER</h1>
                <p id="final-score" style="font-size: 20px; margin: 10px 0; font-weight: bold;"></p>
            </div>
            <button class="btn-action" onclick="entryGame()" id="main-btn">เข้าสู่เกม</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const overlay = document.getElementById("overlay");
        const infoSection = document.getElementById("info-section");
        const gameoverSection = document.getElementById("gameover-section");
        const mainBtn = document.getElementById("main-btn");
        const finalScoreText = document.getElementById("final-score");

        canvas.width = 360;
        canvas.height = 500;

        let gameState = "MENU"; 
        let bird, pipes, frame, score;

        const gravity = 0.5;
        const lift = -8;
        const pipeWidth = 55;
        const pipeGap = 160;      
        const pipeInterval = 95;  

        function init() {
            bird = { x: 60, y: canvas.height / 2, w: 34, h: 24, velocity: 0 };
            pipes = [];
            frame = 0;
            score = 0;
        }

        function entryGame() {
            overlay.style.display = "none";
            gameState = "READY";
            init();
            draw();
        }

        function jump() {
            if (gameState === "READY") gameState = "PLAYING";
            if (gameState === "PLAYING") bird.velocity = lift;
        }

        function draw() {
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดนก
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(bird.x, bird.y, bird.w, bird.h);
            ctx.strokeStyle = "#333";
            ctx.strokeRect(bird.x, bird.y, bird.w, bird.h);

            if (gameState === "PLAYING") {
                bird.velocity += gravity;
                bird.y += bird.velocity;

                if (frame % pipeInterval === 0) {
                    let minH = 50;
                    let topH = Math.floor(Math.random() * (canvas.height - pipeGap - 100)) + minH;
                    pipes.push({ x: canvas.width, top: topH });
                }

                for (let i = pipes.length - 1; i >= 0; i--) {
                    pipes[i].x -= 2.5;
                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
                    ctx.fillRect(pipes[i].x, pipes[i].top + pipeGap, pipeWidth, canvas.height);

                    if (bird.x < pipes[i].x + pipeWidth && bird.x + bird.w > pipes[i].x &&
                        (bird.y < pipes[i].top || bird.y + bird.h > pipes[i].top + pipeGap)) {
                        handleGameOver();
                    }
                    if (pipes[i].x + pipeWidth === 60) score++;
                    if (pipes[i].x + pipeWidth < 0) pipes.splice(i, 1);
                }
                if (bird.y + bird.h > canvas.height || bird.y < 0) handleGameOver();
                frame++;
            } else if (gameState === "READY") {
                ctx.fillStyle = "white";
                ctx.font = "20px Tahoma";
                ctx.textAlign = "center";
                ctx.fillText("แตะหน้าจอเพื่อเริ่มบิน", canvas.width / 2, canvas.height / 2 + 60);
            }

            ctx.fillStyle = "white";
            ctx.font = "bold 35px Tahoma";
            ctx.textAlign = "left";
            ctx.fillText(score, 20, 50);

            if (gameState !== "MENU") requestAnimationFrame(draw);
        }

        function handleGameOver() {
            gameState = "MENU";
            overlay.style.display = "flex";
            infoSection.style.display = "none"; // ซ่อนชื่อผู้จัดทำ
            gameoverSection.style.display = "block"; // โชว์คำว่า Game Over
            finalScoreText.innerText = "คะแนนที่ได้: " + score;
            mainBtn.innerText = "ลองอีกครั้ง";
        }

        window.addEventListener("keydown", (e) => { if (e.code === "Space") jump(); });
        canvas.addEventListener("touchstart", (e) => { jump(); e.preventDefault(); }, {passive: false});
        canvas.addEventListener("mousedown", () => { jump(); });

    </script>
</body>
</html>
