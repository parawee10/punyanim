<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat Jump Mobile</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #87CEEB; 
            font-family: sans-serif; 
            user-select: none; 
            touch-action: none; /* ป้องกันการเลื่อนหน้าจอไปมาบนมือถือ */
        }
        canvas { display: block; }
        
        /* สถิติคะแนน */
        #ui {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: white; font-size: 26px; font-weight: bold; text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        /* ปุ่มเดินสำหรับมือถือ */
        .mobile-controls {
            position: absolute; bottom: 30px; left: 20px;
            display: flex; gap: 15px;
        }
        .btn {
            width: 80px; height: 80px; 
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid white; border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; color: white;
        }
        .btn:active { background: rgba(255, 255, 255, 0.7); }

        /* คำแนะนำกลางจอ */
        #hint {
            position: absolute; bottom: 120px; width: 100%; text-align: center;
            color: rgba(255,255,255,0.6); font-size: 14px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Win: <span id="score">0</span></div>
    <div id="hint">แตะหน้าจอฝั่งขวาหรือพื้นที่ว่างเพื่อกระโดด</div>
    <canvas id="gameCanvas"></canvas>

    <div class="mobile-controls">
        <div id="btnLeft" class="btn">⬅️</div>
        <div id="btnRight" class="btn">➡️</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    let score = 0;
    let canvasWidth, canvasHeight;
    let player, pillars, goal, offset_x;
    
    const GRAVITY = 0.5;
    const JUMP_FORCE = -11;
    const SPEED = 5;

    let keys = { left: false, right: false };

    function init() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        player = {
            x: 100, y: canvasHeight - 200,
            w: 40, h: 40,
            velY: 0
        };
        
        offset_x = 0;
        generateLevel();
    }

    function generateLevel() {
        pillars = [];
        let currentX = 100;
        let lastY = canvasHeight - 150;
        
        const numPillars = 6; 
        for (let i = 0; i < numPillars; i++) {
            let newY = lastY + (Math.random() * 100 - 50); 
            newY = Math.max(canvasHeight * 0.4, Math.min(newY, canvasHeight - 120));
            
            pillars.push({ x: currentX, y: newY, w: 90 });
            currentX += 180; 
            lastY = newY;
        }
        goal = { x: currentX, y: lastY, w: 120 };
    }

    function jump() {
        player.velY = JUMP_FORCE;
    }

    function update() {
        player.velY += GRAVITY;
        player.y += player.velY;

        if (keys.left) player.x -= SPEED;
        if (keys.right) player.x += SPEED;

        // ขอบเขตไม่ให้เดินทะลุซ้ายสุด
        if (player.x < 0) player.x = 0;

        // กล้องตามนุ่มๆ
        let targetOffset = player.x - canvasWidth / 3;
        offset_x += (targetOffset - offset_x) * 0.1;

        const allObjects = [...pillars, goal];
        allObjects.forEach(p => {
            if (player.x + player.w > p.x && player.x < p.x + p.w) {
                if (player.y + player.h >= p.y && player.y + player.h <= p.y + 25 && player.velY >= 0) {
                    player.y = p.y - player.h;
                    player.velY = 0;

                    if (p === goal) {
                        score++;
                        scoreElement.innerText = score;
                        player.x = 100;
                        offset_x = 0;
                        generateLevel();
                    }
                }
            }
        });

        // ตกจอ
        if (player.y > canvasHeight) {
            score = 0;
            scoreElement.innerText = score;
            player.x = 100;
            player.y = canvasHeight - 250;
            player.velY = 0;
            offset_x = 0;
            generateLevel();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // วาดฉากหลังไล่เฉดสี
        let gradient = ctx.createLinearGradient(0, 0, 0, canvasHeight);
        gradient.addColorStop(0, "#87CEEB");
        gradient.addColorStop(1, "#E0F7FA");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        // วาดเสา
        ctx.fillStyle = "#546E7A";
        pillars.forEach(p => {
            ctx.fillRect(p.x - offset_x, p.y, p.w, canvasHeight - p.y);
        });

        // วาดเส้นชัย
        ctx.fillStyle = "#43A047";
        ctx.fillRect(goal.x - offset_x, goal.y, goal.w, canvasHeight - goal.y);

        // วาดแมว
        const px = player.x - offset_x;
        ctx.fillStyle = "#FF9800";
        ctx.fillRect(px, player.y, player.w, player.h);
        // หู
        ctx.beginPath();
        ctx.moveTo(px, player.y); ctx.lineTo(px+10, player.y-10); ctx.lineTo(px+15, player.y); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(px+player.w, player.y); ctx.lineTo(px+player.w-10, player.y-10); ctx.lineTo(px+player.w-15, player.y); ctx.fill();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- การควบคุม (Keyboard สำหรับ PC) ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === 'ArrowUp') jump();
        if (e.key === 'ArrowLeft') keys.left = true;
        if (e.key === 'ArrowRight') keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft') keys.left = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    // --- การควบคุม (Touch สำหรับมือถือ) ---
    // ปุ่มเดินซ้าย-ขวา
    const btnLeft = document.getElementById('btnLeft');
    const btnRight = document.getElementById('btnRight');

    btnLeft.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    btnLeft.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    
    btnRight.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    btnRight.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });

    // แตะที่ว่างของจอเพื่อกระโดด
    window.addEventListener('touchstart', (e) => {
        // ถ้าจุดที่แตะไม่ใช่ปุ่มเดิน ให้ทำการกระโดด
        if (e.target.className !== 'btn') {
            jump();
        }
    }, { passive: false });

    window.addEventListener('resize', init);
    init();
    gameLoop();
</script>
</body>
</html>
