<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat Jump - Pro Controller</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Tahoma', sans-serif; touch-action: manipulation; }
        canvas { display: block; }
        
        /* UI คะแนน */
        #ui {
            position: absolute; top: 10px; width: 100%; text-align: center;
            color: white; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }

        /* ปุ่มกดสำหรับมือถือ */
        .controls {
            position: absolute; bottom: 20px; width: 100%;
            display: flex; justify-content: space-around; padding: 0 10px; box-sizing: border-box;
        }
        .btn {
            width: 70px; height: 70px; background: rgba(255, 255, 255, 0.5);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; user-select: none; -webkit-user-select: none;
        }
        .btn:active { background: rgba(255, 255, 255, 0.8); }
        
        @media (min-width: 768px) { .controls { display: none; } } /* ซ่อนปุ่มบนคอม */
    </style>
</head>
<body>

    <div id="ui">สถิติผ่านด่าน: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <div id="btnLeft" class="btn">⬅️</div>
        <div id="btnJump" class="btn">⬆️</div>
        <div id="btnRight" class="btn">➡️</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    let score = 0;
    let canvasWidth, canvasHeight;
    let player, pillars, goal, offset_x;
    
    const GRAVITY = 0.5;
    const JUMP_FORCE = -10;
    const SPEED = 5;

    // ระบบตรวจสอบปุ่มที่กด
    let keys = { left: false, right: false };

    function init() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        player = {
            x: 100, y: canvasHeight - 200,
            w: 45, h: 40,
            velY: 0, velX: 0
        };
        
        offset_x = 0;
        generateLevel();
    }

    function generateLevel() {
        pillars = [];
        let currentX = 100;
        let lastY = canvasHeight - 150;
        
        const numPillars = Math.floor(Math.random() * 3) + 5;
        for (let i = 0; i < numPillars; i++) {
            let newY = lastY + (Math.random() * 120 - 60); 
            newY = Math.max(canvasHeight * 0.4, Math.min(newY, canvasHeight - 100));
            
            pillars.push({ x: currentX, y: newY, w: 90 });
            currentX += 180; 
            lastY = newY;
        }
        goal = { x: currentX, y: lastY, w: 120 };
    }

    // ฟังก์ชันกระโดดแบบกดรัวได้
    function jump() {
        player.velY = JUMP_FORCE;
    }

    function update() {
        // การเคลื่อนที่แนวตั้ง (กระโดด/ตก)
        player.velY += GRAVITY;
        player.y += player.velY;

        // การเคลื่อนที่แนวนอน (ซ้าย/ขวา)
        if (keys.left) player.x -= SPEED;
        if (keys.right) player.x += SPEED;

        // กล้องเลื่อนตามแมว
        let targetOffset = player.x - canvasWidth / 3;
        offset_x += (targetOffset - offset_x) * 0.1; // ให้กล้องเลื่อนนุ่มๆ

        // ตรวจสอบการชนเสา
        const allObjects = [...pillars, goal];
        allObjects.forEach(p => {
            if (player.x + player.w > p.x && player.x < p.x + p.w) {
                // เช็คว่าตกลงมาใส่เสาพอดีไหม
                if (player.y + player.h >= p.y && player.y + player.h <= p.y + 25 && player.velY >= 0) {
                    player.y = p.y - player.h;
                    player.velY = 0;

                    if (p === goal) {
                        score++;
                        scoreElement.innerText = score;
                        player.x = 100;
                        offset_x = 0;
                        generateLevel();
                    }
                }
            }
        });

        // ตกจอ = Game Over
        if (player.y > canvasHeight) {
            score = 0;
            scoreElement.innerText = score;
            player.x = 100;
            player.y = canvasHeight - 200;
            player.velY = 0;
            offset_x = 0;
            generateLevel();
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // วาดเสา
        ctx.fillStyle = "#5D6D7E";
        pillars.forEach(p => {
            ctx.fillRect(p.x - offset_x, p.y, p.w, canvasHeight - p.y);
            ctx.strokeStyle = "#2C3E50";
            ctx.strokeRect(p.x - offset_x, p.y, p.w, canvasHeight - p.y);
        });

        // วาดเส้นชัย
        ctx.fillStyle = "#27AE60";
        ctx.fillRect(goal.x - offset_x, goal.y, goal.w, canvasHeight - goal.y);

        // วาดตัวแมว
        const drawX = player.x - offset_x;
        ctx.fillStyle = "#F39C12"; // ตัวสีส้ม
        ctx.fillRect(drawX, player.y, player.w, player.h);
        // หู
        ctx.fillStyle = "#E67E22";
        ctx.beginPath();
        ctx.moveTo(drawX, player.y); ctx.lineTo(drawX+10, player.y-12); ctx.lineTo(drawX+18, player.y); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(drawX+player.w, player.y); ctx.lineTo(drawX+player.w-10, player.y-12); ctx.lineTo(drawX+player.w-18, player.y); ctx.fill();
        // ลูกตา
        ctx.fillStyle = "white";
        ctx.fillRect(drawX + 25, player.y + 10, 8, 8);
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- ระบบควบคุม (Keyboard) ---
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') jump();
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    });
    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    // --- ระบบควบคุม (Touch & Mouse สำหรับปุ่มบนจอ) ---
    const setupBtn = (id, action, stopAction) => {
        const el = document.getElementById(id);
        el.addEventListener('mousedown', action);
        el.addEventListener('mouseup', stopAction);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); action(); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); stopAction(); });
    };

    setupBtn('btnLeft', () => keys.left = true, () => keys.left = false);
    setupBtn('btnRight', () => keys.right = true, () => keys.right = false);
    setupBtn('btnJump', jump, () => {});

    window.addEventListener('resize', init);
    init();
    gameLoop();
</script>
</body>
</html>
