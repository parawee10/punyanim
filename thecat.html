<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Jump Adventure</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; }
        canvas { display: block; background: #87CEEB; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            color: white; font-size: 24px; font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">สถิติผ่านด่าน: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');

    // ตั้งค่าตัวแปรเกม
    let score = 0;
    let canvasWidth, canvasHeight;
    let player, pillars, goal, offset_x;
    
    const GRAVITY = 0.6;
    const JUMP_FORCE = -12;

    function init() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        player = {
            x: 100, y: canvasHeight - 200,
            w: 40, h: 40,
            velY: 0, isJumping: false
        };
        
        offset_x = 0;
        generateLevel();
    }

    function generateLevel() {
        pillars = [];
        let currentX = 100;
        let lastY = canvasHeight - 150;
        
        // สร้างเสา 5-8 ต้น
        const numPillars = Math.floor(Math.random() * 4) + 5;
        for (let i = 0; i < numPillars; i++) {
            let newY = lastY + (Math.random() * 100 - 50); // สูงต่ำไม่ห่างกันเกิน 50px
            newY = Math.max(canvasHeight * 0.4, Math.min(newY, canvasHeight - 100)); // คุมขอบเขต
            
            pillars.push({ x: currentX, y: newY, w: 80 });
            currentX += Math.random() * 50 + 150; // ระยะห่าง
            lastY = newY;
        }
        
        // เสาสุดท้ายเป็นเส้นชัย
        goal = { x: currentX, y: lastY, w: 100 };
    }

    function jump() {
        if (!player.isJumping) {
            player.velY = JUMP_FORCE;
            player.isJumping = true;
        }
    }

    function update() {
        player.velY += GRAVITY;
        player.y += player.velY;

        // กล้องเลื่อนตามแมว
        if (player.x - offset_x > canvasWidth * 0.4) {
            offset_x = player.x - canvasWidth * 0.4;
        }

        let onPillar = false;
        const allObjects = [...pillars, goal];

        allObjects.forEach(p => {
            // เช็คการชน (Collision)
            if (player.x + player.w > p.x && player.x < p.x + p.w) {
                if (player.y + player.h >= p.y && player.y + player.h <= p.y + 20 && player.velY >= 0) {
                    player.y = p.y - player.h;
                    player.velY = 0;
                    player.isJumping = false;
                    onPillar = true;

                    if (p === goal) {
                        score++;
                        scoreElement.innerText = score;
                        player.x = 100;
                        offset_x = 0;
                        generateLevel();
                    }
                }
            }
        });

        // ตกจอ
        if (player.y > canvasHeight) {
            score = 0;
            scoreElement.innerText = score;
            player.x = 100;
            player.y = canvasHeight - 200;
            offset_x = 0;
            generateLevel();
        }

        player.x += 2; // แมวเดินไปข้างหน้าช้าๆ (ถ้าไม่เดินเลยจะเล่นยาก)
    }

    function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        // วาดเสา
        ctx.fillStyle = "#666";
        pillars.forEach(p => {
            ctx.fillRect(p.x - offset_x, p.y, p.w, canvasHeight - p.y);
        });

        // วาดเส้นชัย
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(goal.x - offset_x, goal.y, goal.w, canvasHeight - goal.y);

        // วาดแมว (สี่เหลี่ยมสีส้ม)
        ctx.fillStyle = "#e67e22";
        ctx.fillRect(player.x - offset_x, player.y, player.w, player.h);
        // หูแมวเล็กๆ
        ctx.beginPath();
        ctx.moveTo(player.x - offset_x, player.y);
        ctx.lineTo(player.x - offset_x + 10, player.y - 10);
        ctx.lineTo(player.x - offset_x + 20, player.y);
        ctx.fill();
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Input รองรับทั้งคีย์บอร์ดและทัช
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
    window.addEventListener('touchstart', (e) => { jump(); e.preventDefault(); }, {passive: false});
    window.addEventListener('mousedown', jump);
    window.addEventListener('resize', init);

    init();
    gameLoop();
</script>
</body>
</html>
