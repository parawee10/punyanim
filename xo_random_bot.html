<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกม XO เล่นกับบอทกากๆ</title>
    <style>
        /* CSS สำหรับจัดรูปแบบ */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e0f7fa; /* สีพื้นหลังอ่อน */
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        #status {
            font-size: 1.6em;
            margin-bottom: 25px;
            font-weight: bold;
            color: #007bff;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(3, 110px);
            gap: 6px;
            background-color: #333;
            border: 8px solid #333;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
        }

        .cell {
            width: 110px;
            height: 110px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4em;
            cursor: pointer;
            transition: background-color 0.1s;
            border: none;
            border-radius: 4px;
            font-weight: 900;
        }

        .cell:hover:empty {
            background-color: #e6e6e6;
        }

        .x-player {
            color: #ff4136; /* คุณ (X) */
        }

        .o-player {
            color: #0074d9; /* โรบอท (O) */
        }

        #reset-button {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 1.3em;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>
    <h1>เกม XO (คุณ vs บอทสุ่ม)</h1>
    <div id="status">ตาของคุณ: X</div>
    <div id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>
    <button id="reset-button">เริ่มเกมใหม่</button>

    <script>
        // JavaScript สำหรับการทำงานของเกม
        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');
        const resetButton = document.getElementById('reset-button');

        let board = ["", "", "", "", "", "", "", "", ""];
        const humanPlayer = "X";
        const aiPlayer = "O";
        let gameActive = true; 

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const updateStatus = (message, color = '#007bff') => {
            statusDisplay.textContent = message;
            statusDisplay.style.color = color; 
        };

        // ฟังก์ชันตรวจสอบผลลัพธ์
        const checkGameResult = () => {
            let roundWon = false;
            let winner = null;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winner = board[a];
                    break;
                }
            }

            if (roundWon) {
                const winnerName = (winner === humanPlayer) ? "คุณ" : "โรบอท";
                updateStatus(`${winnerName} ชนะแล้ว! 🎉`, '#ff4136');
                gameActive = false;
                return true; 
            }

            let roundDraw = !board.includes("");
            if (roundDraw) {
                updateStatus('เสมอ! 🤝 ไม่มีใครชนะ', '#ffc107');
                gameActive = false;
                return true; 
            }
            
            return false; 
        };

        // ********** ส่วนของ AI (บอทกากๆ - เลือกสุ่ม) **********
        const aiMove = () => {
            if (!gameActive) return;

            // 1. หาช่องที่ว่างทั้งหมด
            const availableIndices = board
                .map((value, index) => (value === "" ? index : null))
                .filter(index => index !== null);

            if (availableIndices.length > 0) {
                // 2. เลือกช่องว่างแบบสุ่ม 🎲 (นี่คือส่วนที่ทำให้บอท "กาก")
                const randomIndex = Math.floor(Math.random() * availableIndices.length);
                const moveIndex = availableIndices[randomIndex];
                
                // 3. ลง 'O' และอัปเดต UI
                board[moveIndex] = aiPlayer;
                const cellElement = cells[moveIndex];
                cellElement.textContent = aiPlayer;
                cellElement.classList.add('o-player');
                
                // 4. ตรวจสอบผล และเปลี่ยนตา
                if (!checkGameResult()) {
                    updateStatus(`ตาของคุณ: ${humanPlayer}`);
                }
            }
        };
        // ***************************************

        // ฟังก์ชันจัดการการคลิกของผู้เล่น
        const handleCellClick = (event) => {
            const clickedCell = event.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // ตรวจสอบความถูกต้องของการลง
            if (board[clickedCellIndex] !== "" || !gameActive) {
                return;
            }

            // 1. ผู้เล่นลง 'X'
            board[clickedCellIndex] = humanPlayer;
            clickedCell.textContent = humanPlayer;
            clickedCell.classList.add('x-player');
            
            // 2. ตรวจสอบผลลัพธ์หลังผู้เล่นลง
            if (!checkGameResult()) {
                // 3. ให้ AI ลงต่อ (หน่วงเวลา 0.5 วินาทีเพื่อให้เห็นว่าบอทกำลังตอบสนอง)
                updateStatus(`บอทกำลังสุ่ม...`, '#0074d9');
                setTimeout(aiMove, 500); 
            }
        };

        // ฟังก์ชันเริ่มเกมใหม่
        const handleRestartGame = () => {
            gameActive = true;
            board = ["", "", "", "", "", "", "", "", ""];
            updateStatus(`ตาของคุณ: ${humanPlayer}`);
            
            cells.forEach(cell => {
                cell.textContent = "";
                cell.className = 'cell'; // รีเซ็ต class และสี
            });
        };

        // กำหนด Event Listeners
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetButton.addEventListener('click', handleRestartGame);
        
        // ตั้งค่าเริ่มต้นเมื่อโหลดหน้า
        handleRestartGame();
    </script>
</body>
</html>
